          g.gain.exponentialRampToValueAtTime(0.0001, now + sec);
        }
        setTimeout(function () { try { g.disconnect(); } catch (e) {} }, (sec + 0.12) * 1000);
      } catch (e) {}
    });
  }
  // 超过上限时，立即淡出并丢弃最旧的若干个，
  // 避免长曲目长时间踩踏板导致节点引用无界增长（内存持续上涨）
  function capGainList(list, cap, fadeSec) {
    if (!list || list.length <= cap) return;
    const excess = list.length - cap;
    const drop = list.splice(0, excess);
    fadeAndDropGains(drop, fadeSec);
  }
  // 剔除已接近静音的增益节点
  function pruneSilentGains(list) {
    if (!list || !list.length) return;
    for (let i = list.length - 1; i >= 0; i--) {
      try {
        if (list[i].gain.value < 0.0015) {
          try { list[i].disconnect(); } catch (e) {}
          list.splice(i, 1);
        }
      } catch (e) {
        list.splice(i, 1);
      }
    }
  }

  /** 延音踏板：受 pedalEnabled 控制；抬起时同时收掉弦间共鸣 */
  function setPedal(on) {
    if (on && !state.pedalEnabled) on = false;
    if (on === state.pedalDown) return;
    state.pedalDown = on;
    if (!on) {
      fadeAndDropGains(state.sustainedGains, 0.38);
      fadeAndDropGains(state.resonanceGains, 0.55);
      state.sustainedGains = [];
      state.resonanceGains = [];
    }
  }

  /**
   * 合成钢琴 v2：
   * - 更锐利的琴锤瞬态（噪声 + 短促敲击正弦）
   * - 9 层谐波 + 非谐 + 力度相关衰减
   * - 力度相关低通（轻触暗、重触亮）
   * - 踏板弦间共鸣（八度/五度/同音级极轻长尾）
   * - 声板 resonator 总线
   * - 立体声按弦位平移
   */
  const HAMMER_NOISE_VARIANTS = 4;
  function getHammerNoiseBuffer() {
    if (!state.hammerNoiseBuffers || !state.hammerNoiseBuffers.length) {
      state.hammerNoiseBuffers = [];
      const nLen = Math.floor(state.audioCtx.sampleRate * 0.016);
      for (let v = 0; v < HAMMER_NOISE_VARIANTS; v++) {
        const buf = state.audioCtx.createBuffer(1, nLen, state.audioCtx.sampleRate);
        const nd = buf.getChannelData(0);
        for (let i = 0; i < nLen; i++) {
          nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nLen * 0.11));
        }
        state.hammerNoiseBuffers.push(buf);
      }
    }
    return state.hammerNoiseBuffers[(Math.random() * state.hammerNoiseBuffers.length) | 0];
  }

  function playNote(note, duration, volume, when, opts) {
    duration = duration == null ? 0.4 : duration;
    volume = volume == null ? 0.4 : volume;
    when = when || 0;
    opts = opts || {};
    if (!note || note === "-" || note === "rest") return;
    if (!Number.isFinite(duration) || !Number.isFinite(volume) || !Number.isFinite(when)) return;
    if (!state.audioCtx) ensureAudio();
    const f = freqMap[note];
    if (!f || volume < 0.001) return;
    // 枫叶随音符飘落：横竖屏均生效，声部压力高时跳过
    try {
      if (window.leafFx && state.isPlaying && !state.isPaused) {
        var spawnDelay = Math.max(0, ((when > 0 ? when : state.audioCtx.currentTime) - state.audioCtx.currentTime) * 1000);
        var spawnVel = volume;
        var spawnDur = duration;
        setTimeout(function () {
          if (window.leafFx) window.leafFx.onNote(spawnVel, spawnDur);
        }, spawnDelay);
      }
    } catch (eLeaf) {}
    state.audioSessionNoteCount++;
    if (state.audioSessionNoteCount % PERIODIC_CLEANUP_EVERY === 0) {
      pruneSilentGains(state.sustainedGains);
      pruneSilentGains(state.resonanceGains);
    }

    const t0 = when > 0 ? when : state.audioCtx.currentTime;
    const midiApprox = 69 + 12 * Math.log2(f / 440);
    const heightAtten = 1 - Math.max(0, (midiApprox - 58) * 0.0065) + Math.max(0, (50 - midiApprox) * 0.004);
    const human = 0.92 + Math.random() * 0.12;
    const vel = Math.max(0.0001, Math.min(1, volume * heightAtten * human));
    // 丢音策略放宽：软过载不丢；硬过载只丢极弱；顶满才丢较弱音
    const pressureBefore = voicePressureLevel();
    if (pressureBefore >= 3 && vel < 0.08) return;
    if (pressureBefore >= 2 && vel < 0.04) return;
    shedVoicesIfNeeded();

    // 压力下略缩短踏板尾巴，但不至于发干
    const sustainExtra = state.pedalDown
      ? (pressureBefore >= 3 ? 0.9 : (pressureBefore >= 2 ? 1.2 : 1.55))
      : 0;
    const bodyDur = duration + sustainExtra;

    state.activeVoiceLoad++;
    const voiceLifeMs = Math.max(0, (t0 - state.audioCtx.currentTime) + bodyDur + (pressureBefore >= 3 ? 2.0 : 3.5)) * 1000;
    setTimeout(function () { state.activeVoiceLoad = Math.max(0, state.activeVoiceLoad - 1); }, voiceLifeMs);
    const pressure = voicePressureLevel();
    const isOverloaded = pressure >= 2;
    const isSoftOverloaded = pressure >= 1;
    // 仅顶满时关高亮/滚动，避免一忙就「琴键不亮」
    if (pressure >= 3) opts = Object.assign({}, opts, { noHighlight: true, scroll: false });

    // iOS 仅硬过载以上跳过声像；其余直接 create（无节点池，音色与原版一致）
    const pan = (IS_IOS_SAFARI && pressure >= 2)
      ? null
      : (state.audioCtx.createStereoPanner ? state.audioCtx.createStereoPanner() : null);
    if (pan) {
      const p = Math.max(-0.58, Math.min(0.58, (midiApprox - 60) / 42));
      pan.pan.setValueAtTime(p, t0);
    }

    const noteGain = state.audioCtx.createGain();
    const filter = state.audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    const bright = 2800 + f * 0.55 + vel * 3200;
    const dark = 420 + f * 0.12 + vel * 180;
    filter.frequency.setValueAtTime(bright, t0);
    filter.frequency.exponentialRampToValueAtTime(Math.max(dark, 160), t0 + Math.min(0.55, bodyDur * 0.55));
    filter.Q.value = 0.55 + (1 - vel) * 0.35;

    // 琴锤瞬态（顶满时跳过）
    try {
      if (pressure >= 3) throw new Error("skip-hammer");
      const nBuf = getHammerNoiseBuffer();
      const nSrc = state.audioCtx.createBufferSource();
      nSrc.buffer = nBuf;
      const nBp = state.audioCtx.createBiquadFilter();
      nBp.type = "bandpass";
      nBp.frequency.value = Math.min(7800, 1600 + f * 4.2 + vel * 1200);
      nBp.Q.value = 0.75;
      const nG = state.audioCtx.createGain();
      nG.gain.setValueAtTime(vel * (0.18 + vel * 0.08), t0);
      nG.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.022);
      nSrc.connect(nBp);
      nBp.connect(nG);
      nG.connect(noteGain);
      nSrc.start(t0);
      nSrc.stop(t0 + 0.03);

      const click = state.audioCtx.createOscillator();
      const cg = state.audioCtx.createGain();
      click.type = "sine";
      click.frequency.setValueAtTime(Math.min(2400, 700 + f * 1.8), t0);
      click.frequency.exponentialRampToValueAtTime(Math.max(180, f * 0.6), t0 + 0.012);
      cg.gain.setValueAtTime(vel * 0.12, t0);
      cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.014);
      click.connect(cg);
      cg.connect(noteGain);
      click.start(t0);
      click.stop(t0 + 0.02);
    } catch (e) {}

    // 谐波：非谐 + 力度相关衰减
    const B = 0.00014;
    const partials = [
      { n: 1, amp: 0.50, decay: 1.05, type: "triangle" },
      { n: 2, amp: 0.30, decay: 1.35, type: "sine" },
      { n: 3, amp: 0.16, decay: 1.75, type: "sine" },
      { n: 4, amp: 0.10, decay: 2.15, type: "sine" },
      { n: 5, amp: 0.055, decay: 2.55, type: "sine" },
      { n: 6, amp: 0.032, decay: 2.95, type: "sine" },
      { n: 7, amp: 0.018, decay: 3.35, type: "sine" },
      { n: 8, amp: 0.011, decay: 3.75, type: "sine" },
      { n: 9, amp: 0.006, decay: 4.10, type: "sine" }
    ];

    partials.forEach(function (p) {
      if (pressure >= 3 && p.n > 3) return;
      if (pressure >= 2 && p.n > 4) return;
      if (isSoftOverloaded && p.n > 6) return;
      const osc = state.audioCtx.createOscillator();
      const g = state.audioCtx.createGain();
      osc.type = p.type;
      const fn = p.n * f * Math.sqrt(1 + B * p.n * p.n);
      osc.frequency.setValueAtTime(fn, t0);
      osc.detune.setValueAtTime((Math.random() - 0.5) * 2.2, t0);
      const ampScale = p.n <= 2 ? 1 : (0.55 + vel * 0.55);
      const peak = vel * p.amp * ampScale;
      const decayMul = 1 + (1 - vel) * 0.45 * Math.max(0, p.n - 2);
      const pEnd = t0 + Math.min(bodyDur * p.decay / decayMul, bodyDur + 0.7);
      const atk = 0.003 + (1 - vel) * 0.01 + (p.n > 4 ? 0.004 : 0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(peak * (0.55 + vel * 0.15), t0 + 0.055 + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, pEnd);
      osc.connect(g);
      g.connect(filter);
      osc.start(t0);
      osc.stop(pEnd + 0.05);
    });

    // 基音下八度轻共鸣（软过载时跳过）
    if (midiApprox > 36 && !isSoftOverloaded) {
      const sub = state.audioCtx.createOscillator();
      const sg = state.audioCtx.createGain();
      sub.type = "sine";
      sub.frequency.setValueAtTime(f * 0.5, t0);
      const subPeak = vel * (state.pedalDown ? 0.055 : 0.028);
      sg.gain.setValueAtTime(0.0001, t0);
      sg.gain.exponentialRampToValueAtTime(subPeak, t0 + 0.06);
      sg.gain.exponentialRampToValueAtTime(0.0001, t0 + bodyDur * 1.05);
      sub.connect(sg);
      sg.connect(filter);
      sub.start(t0);
      sub.stop(t0 + bodyDur + 0.25);
    }

    // 踏板弦间共鸣（负载过高时跳过）
    if (state.pedalDown && vel > 0.08 && !isOverloaded) {
      const ratios = [0.5, 2, 1.5, 3];
      const levels = [0.04, 0.035, 0.022, 0.015];
      ratios.forEach(function (r, i) {
        const rf = f * r;
        if (rf < 28 || rf > 4200) return;
        const ro = state.audioCtx.createOscillator();
        const rg = state.audioCtx.createGain();
        ro.type = "sine";
        ro.frequency.setValueAtTime(rf * (1 + (Math.random() - 0.5) * 0.0015), t0);
        const peak = vel * levels[i];
        rg.gain.setValueAtTime(0.0001, t0);
        rg.gain.exponentialRampToValueAtTime(peak, t0 + 0.12 + i * 0.03);
        rg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.8 + duration);
        ro.connect(rg);
        rg.connect(state.dryGain);
        ro.start(t0);
        ro.stop(t0 + 3.2 + duration);
        if ((state.resonanceGains.length & 7) === 0) pruneSilentGains(state.resonanceGains);
        state.resonanceGains.push(rg);
        capGainList(state.resonanceGains, MAX_RESONANCE_GAINS, 0.3);
      });
    }

    const attack = 0.004 + (1 - vel) * 0.012;
    noteGain.gain.setValueAtTime(0.0001, t0);
    noteGain.gain.exponentialRampToValueAtTime(1, t0 + attack);
    noteGain.gain.setValueAtTime(1, t0 + Math.min(0.12, duration * 0.35));
    if (state.pedalDown) {
      noteGain.gain.setValueAtTime(0.7, t0 + duration);
      if ((state.sustainedGains.length & 7) === 0) pruneSilentGains(state.sustainedGains);
      state.sustainedGains.push(noteGain);
      capGainList(state.sustainedGains, MAX_SUSTAINED_GAINS, 0.24);
      const safeEnd = t0 + bodyDur + 1.1;
      noteGain.gain.setValueAtTime(0.55, safeEnd - 0.55);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, safeEnd);
    } else {
      const release = Math.max(0.16, duration * 0.5);
      noteGain.gain.setValueAtTime(0.58, t0 + Math.max(attack + 0.04, duration - release));
      noteGain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration + 0.04);
    }

    // 主干结束后 disconnect，避免节点静默堆积
    (function scheduleTrunkCleanup() {
      const pedalSustained = !!state.pedalDown;
      const cleanupSec = Math.max(0, (t0 - state.audioCtx.currentTime) + bodyDur + (pressureBefore >= 3 ? 2.2 : 3.8));
      setTimeout(function () {
        try { filter.disconnect(); } catch (e) {}
        try { if (pan) pan.disconnect(); } catch (e) {}
        if (!pedalSustained) { try { noteGain.disconnect(); } catch (e) {} }
      }, cleanupSec * 1000);
    })();

    filter.connect(noteGain);
    if (pan) {
      noteGain.connect(pan);
      pan.connect(state.dryGain);
      pan.connect(state.reverbNode);
      if (!isSoftOverloaded) state.bodyResonators.forEach(function (bp) { pan.connect(bp); });
    } else {
      noteGain.connect(state.dryGain);
      noteGain.connect(state.reverbNode);
      if (!isSoftOverloaded) state.bodyResonators.forEach(function (bp) { noteGain.connect(bp); });
    }

    if (!opts.noHighlight) {
      // 同一音符若还有尚未触发的按键事件（on 或 off），先撤销，避免连击/换图时状态错乱
      for (let i = pendingHighlights.length - 1; i >= 0; i--) {
        if (pendingHighlights[i].note === note) pendingHighlights.splice(i, 1);
      }
      pendingHighlights.push({ type: "on", note: note, t0: t0, dur: duration, scroll: !!opts.scroll });
      ensureHighlightLoop();
    }
  }

  const SCROLL_THROTTLE_MS = 90; // 滚动节流：高密度音符/快速走句时，减少布局计算与滚动重排频率
  function scrollKeyIntoView(note) {
    const now = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    if (now - state.lastScrollUpdateAt < SCROLL_THROTTLE_MS) return;
    state.lastScrollUpdateAt = now;
    const notes = [note];
    if (state.previewNote) notes.push(state.previewNote);
    centerOnNotes(notes);
  }

  // ========== 4b. 表情曲线 & MIDI 解析 ==========

  /** 为旋律生成拱形/乐句渐强渐弱曲线（0.55–1.0） */
  function buildExpressionCurve(mel) {
    const n = mel.length;
    const curve = new Array(n);
    if (n === 0) return curve;
    // 以 8 音为一句，句内正弦拱形；整首再叠一层大拱
    for (let i = 0; i < n; i++) {
      const phrase = 8;
      const local = (i % phrase) / Math.max(1, phrase - 1);
      const phraseArch = 0.62 + 0.38 * Math.sin(Math.PI * local);
      const global = 0.85 + 0.15 * Math.sin(Math.PI * (i / Math.max(1, n - 1)));
      // 休止保持，不参与
      if (mel[i] === "-" || mel[i] === "rest") curve[i] = 0.7;
      else curve[i] = Math.min(1, phraseArch * global);
    }
    return curve;
  }

  function expressionAt(index) {
    if (!state.expressionEnabled || !state.expressionCurve.length) return 1;
    return state.expressionCurve[index % state.expressionCurve.length] || 1;
  }

  // --- 简易 MIDI 解析（Format 0/1，提取 note on/off）---
  function readVarLen(view, offset) {
    let value = 0, b;
    do {
      b = view.getUint8(offset.value++);
      value = (value << 7) | (b & 0x7f);
    } while (b & 0x80);
    return value;
  }

  const MAX_MIDI_FILE_BYTES = 3 * 1024 * 1024; // 3MB，远超常规MIDI文件体量
  const MAX_MIDI_TRACKS = 128;
  const MAX_MIDI_EVENTS = 20000; // 远超真实曲目音符数（Für Elise 全曲约2100个）

  function parseMidiFile(arrayBuffer) {
    if (arrayBuffer.byteLength > MAX_MIDI_FILE_BYTES) {
      throw new Error("文件过大（超过 " + (MAX_MIDI_FILE_BYTES / 1024 / 1024) + "MB），已拒绝导入");
    }
    const view = new DataView(arrayBuffer);
    let o = 0;
    const id = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
    if (id !== "MThd") throw new Error("不是有效的 MIDI 文件");
    o = 8;
    const format = view.getUint16(o); o += 2;
    const nTracks = view.getUint16(o); o += 2;
    if (nTracks > MAX_MIDI_TRACKS) throw new Error("音轨数过多（" + nTracks + " 条），已拒绝导入");
    const division = view.getUint16(o); o += 2;
    if (division & 0x8000) throw new Error("暂不支持 SMPTE 时基");
    const tpq = division; // ticks per quarter note
    if (!tpq || tpq <= 0) throw new Error("MIDI 时间刻度（division）无效");

    const rawNotes = []; // {tick, midi, durTicks, vel, channel}
    const tempoEvents = []; // {tick, usPerQ}：全曲速度变化（rubato/渐快渐慢），各音轨共享同一 tick 时间轴

    for (let tr = 0; tr < nTracks; tr++) {
      if (o + 8 > view.byteLength) break;
      const chunkId = String.fromCharCode(view.getUint8(o), view.getUint8(o+1), view.getUint8(o+2), view.getUint8(o+3));
      const chunkLen = view.getUint32(o + 4);
      o += 8;
      if (chunkId !== "MTrk") { o += chunkLen; continue; }
      const end = o + chunkLen;
      let tick = 0;
      let running = null;
      const active = new Map(); // key: channel*128+note -> {tick, vel}

      while (o < end) {
        const off = { value: o };
        const delta = readVarLen(view, off);
        o = off.value;
        tick += delta;
        if (o >= end) break;
        let status = view.getUint8(o);
        if (status < 0x80) {
          if (running === null) throw new Error("MIDI running status 错误");
          status = running;
        } else {
          o++;
          running = status;
        }
        const type = status & 0xf0;
        const ch = status & 0x0f;

        if (type === 0x90 || type === 0x80) {
          const note = view.getUint8(o++);
          const vel = view.getUint8(o++);
          const key = ch * 128 + note;
          if (type === 0x90 && vel > 0) {
            active.set(key, { tick: tick, vel: vel });
          } else {
            const on = active.get(key);
            if (on) {
              if (rawNotes.length >= MAX_MIDI_EVENTS) {
                throw new Error("音符数超过上限（" + MAX_MIDI_EVENTS + "），已拒绝导入");
              }
              rawNotes.push({
                tick: on.tick,
                midi: note,
                durTicks: Math.max(1, tick - on.tick),
                vel: on.vel,
                channel: ch
              });
              active.delete(key);
            }
          }
        } else if (type === 0xa0 || type === 0xb0 || type === 0xe0) {
          o += 2;
        } else if (type === 0xc0 || type === 0xd0) {
          o += 1;
        } else if (status === 0xff) {
          const meta = view.getUint8(o++);
          const off2 = { value: o };
          const len = readVarLen(view, off2);
          if (meta === 0x51 && len === 3) {
            // set_tempo：3 字节大端 = 每四分音符的微秒数
            const usPerQ = (view.getUint8(off2.value) << 16) | (view.getUint8(off2.value + 1) << 8) | view.getUint8(off2.value + 2);
            if (usPerQ > 0) tempoEvents.push({ tick: tick, usPerQ: usPerQ });
          }
          o = off2.value + len;
        } else if (status === 0xf0 || status === 0xf7) {
          const off2 = { value: o };
          const len = readVarLen(view, off2);
          o = off2.value + len;
        } else {
          break;
        }
      }
      // 未关闭的 note：给默认长度
      active.forEach(function (on, key) {
        rawNotes.push({
          tick: on.tick,
          midi: key % 128,
          durTicks: tpq,
          vel: on.vel,
          channel: (key / 128) | 0
        });
      });
      o = end;
    }

    if (!rawNotes.length) throw new Error("MIDI 中没有音符");

    // 转为以四分音符为 1 拍的秒级事件（速度滑条会整体缩放播放速度）
    rawNotes.sort(function (a, b) { return a.tick - b.tick || a.midi - b.midi; });

    // ---- 校准速度变化：MIDI 中常见的渐快/渐慢（rubato）由多个 set_tempo 事件表达，
    // 若直接用 tick/tpq 当作拍数会完全丢失这种相对快慢曲线（所有音符按同一速度铺开）。
    // 这里以「首个速度事件（或默认 120 BPM）」为参照速度，把每个 tick 换算成
    // 参照速度下的等效拍数：单一速度的文件与旧逻辑（tick/tpq）完全等价，不受影响；
    // 含速度变化的文件则会正确保留原曲的快慢比例，再统一被 UI 速度滑条缩放。
    tempoEvents.sort(function (a, b) { return a.tick - b.tick; });
    if (!tempoEvents.length || tempoEvents[0].tick !== 0) {
      tempoEvents.unshift({ tick: 0, usPerQ: 500000 }); // MIDI 规范默认：120 BPM
    }
    const refBpm = 60000000 / tempoEvents[0].usPerQ;
    const cumSeconds = [0];
    for (let ti = 1; ti < tempoEvents.length; ti++) {
      const segTicks = tempoEvents[ti].tick - tempoEvents[ti - 1].tick;
      cumSeconds.push(cumSeconds[ti - 1] + (segTicks * (tempoEvents[ti - 1].usPerQ / 1e6)) / tpq);
    }
    function tickToRefBeat(tick) {
      let lo = 0, hi = tempoEvents.length - 1;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (tempoEvents[mid].tick <= tick) lo = mid; else hi = mid - 1;
      }
      const segTicks = tick - tempoEvents[lo].tick;
      const seconds = cumSeconds[lo] + (segTicks * (tempoEvents[lo].usPerQ / 1e6)) / tpq;
      return seconds * (refBpm / 60);
    }

    const events = [];
    rawNotes.forEach(function (n) {
      const name = midiToName(n.midi);
      if (!name) return;
      const beat = tickToRefBeat(n.tick);
      const durBeats = Math.max(0.15, tickToRefBeat(n.tick + n.durTicks) - beat);
      if (!Number.isFinite(beat) || !Number.isFinite(durBeats)) return;
      events.push({
        beat: beat,
        durBeats: durBeats,
        note: name,
        vel: Math.min(1, 0.35 + (n.vel / 127) * 0.65)
      });
    });
    if (!events.length) throw new Error("MIDI 中没有可播放的有效音符（可能超出音域或时间数据损坏）");
    return events;
  }

  function clearMidiTimers() {
    state.midiTimerIds.forEach(function (id) { clearTimeout(id); });
    state.midiTimerIds = [];
    if (state.midiEndTimer) { clearTimeout(state.midiEndTimer); state.midiEndTimer = null; }
    if (state.midiRaf) { clearTimeout(state.midiRaf); state.midiRaf = null; }
    state.midiPlaying = false;
  }

  /** 每拍秒数（tempo 夹在 30–240；NaN/非法值回退 92） */
  function midiBeatSec() {
    var t = Number(state.tempo);
    if (!Number.isFinite(t) || t <= 0) t = 92;
    t = Math.max(30, Math.min(240, t));
    return 60 / t;
  }

  /** 当前乐曲时间线位置（拍） */
  function midiNowBeat() {
    if (!state.audioCtx || !state.midiPlaying) return state.midiBeatOffset;
    return state.midiBeatOffset + (state.audioCtx.currentTime - state.midiAbsStart) / midiBeatSec();
  }

  /**
   * 窗口调度：只提前安排 LOOKAHEAD_BEATS 内的音符，避免数千 setTimeout。
   * 改速时调用 midiRescheduleFromNow() 即可从当前位置重排。
   */
  const MIDI_LOOKAHEAD_BEATS = IS_LOW_POWER ? 1.2 : 1.5;
  const MIDI_POLL_MS = 40;
  const MIDI_POLL_MS_BUSY = 16;
  const MIDI_BATCH_SIZE = IS_LOW_POWER ? 12 : 16;
  const MIDI_STALE_DROP_SEC = 0.10;

  function midiScheduleWindow() {
    try {
      midiScheduleWindowImpl();
    } catch (e) {
      // 心跳保护：调度过程中任何未预期的异常都不能让播放彻底卡死。
      // 记录错误，并在仍处于播放状态时安排一次重试，让心跳自愈。
      console.error("midiScheduleWindow 异常，已捕获并尝试自愈:", e);
      if (state.isPlaying && state.midiPlaying) {
        if (state.midiRaf) { clearTimeout(state.midiRaf); }
        state.midiRaf = setTimeout(midiScheduleWindow, MIDI_POLL_MS);
      }
    }
  }

  function midiScheduleWindowImpl() {
    if (!state.midiPlaying || !state.isPlaying || !state.midiEvents || !state.audioCtx) return;
    // 到量自动回收（相当于自动做一次暂停再继续），已在内部完成续排并重新挂好下一轮心跳，此处直接返回
    if (maybeAutoRecycleAudioGraph()) return;
    var beatSec = midiBeatSec();
    var nowBeat = midiNowBeat();
    if (!Number.isFinite(beatSec) || beatSec <= 0) {
      state.tempo = 92;
      beatSec = midiBeatSec();
    }
    if (!Number.isFinite(nowBeat)) nowBeat = state.midiBeatOffset || 0;
    const horizon = nowBeat + MIDI_LOOKAHEAD_BEATS;
    const nowAudio = state.audioCtx.currentTime;

    let scheduledInRound = 0;
    while (state.midiNextIndex < state.midiEvents.length) {
      const ev = state.midiEvents[state.midiNextIndex];
      if (!ev || !Number.isFinite(ev.beat) || !Number.isFinite(ev.durBeats)) {
        // 单条事件数据损坏：跳过，不影响其余音符
        state.midiNextIndex++;
        continue;
      }
      if (ev.beat > horizon) break;
      const pressure = voicePressureLevel();
      // 分批：只在顶满时明显缩窗；不要因为压力就跳过中等力度的和弦音
      const batchLimit = pressure >= 3 ? (IS_LOW_POWER ? 6 : 8)
        : (pressure >= 2 ? (IS_LOW_POWER ? 9 : 12) : MIDI_BATCH_SIZE);
      if (scheduledInRound >= batchLimit) break;
      // 仅顶满时跳过很弱的伴奏音
      if (pressure >= 3 && ev.vel < 0.22) {
        state.midiNextIndex++;
        continue;
      }
      // 已过去的音：略过或极短补发
      const when = state.midiAbsStart + (ev.beat - state.midiBeatOffset) * beatSec;
      const dur = Math.min(ev.durBeats * beatSec, 2.5);
      const idx = state.midiNextIndex;
      state.midiNextIndex++;
      if (!Number.isFinite(when) || !Number.isFinite(dur)) continue;

      if (when + dur < nowAudio - 0.05) continue; // 彻底过期
      // 过期音丢弃：起始时间迟到太多（例如后台节流后恢复），不再补发，避免追赶时扎堆爆音
      if (nowAudio - when > MIDI_STALE_DROP_SEC) continue;

      scheduledInRound++;
      const phrase = 12;
      const local = (idx % phrase) / Math.max(1, phrase - 1);
      const expr = state.expressionEnabled ? (0.62 + 0.38 * Math.sin(Math.PI * local)) : 1;
      const vel = state.mainVol * ev.vel * expr;
      const startWhen = Math.max(when, nowAudio);
      const pressNow = voicePressureLevel();
      const lightUI = pressNow >= 3;

      try {
        playNote(
          transposeNote(ev.note),
          Math.max(0.08, when + dur - startWhen),
          vel,
          startWhen,
          { scroll: !lightUI, noHighlight: lightUI }
        );
      } catch (e) {}

      if (!lightUI) {
        const previewDelay = Math.max(0, (startWhen - nowAudio) * 1000);
        const tidPrev = setTimeout(function () {
          if (!state.isPlaying || !state.midiPlaying) return;
          try {
            const next = state.midiEvents[idx + 1];
            if (next) showPreview(transposeNote(next.note));
            else clearPreview();
          } catch (e) {}
        }, previewDelay);
        state.midiTimerIds.push(tidPrev);
      }
    }

    // 全部结束
    if (state.midiNextIndex >= state.midiEvents.length) {
      const last = state.midiEvents[state.midiEvents.length - 1];
      const endBeat = last ? (last.beat + last.durBeats) : nowBeat;
      const endIn = Math.max(0.2, (endBeat - nowBeat) * beatSec + 0.4);
      state.midiEndTimer = setTimeout(function () {
        if (!state.isPlaying) return;
        if (state.loopEnabled) {
          clearMidiTimers();
          state.midiPlaying = true;
          state.midiBeatOffset = 0;
          state.midiNextIndex = 0;
          state.midiAbsStart = state.audioCtx.currentTime + 0.08;
          document.getElementById("status").textContent =
            "循环 · 《" + state.currentSong.name + "》";
          if (state.midiEvents[0]) showPreview(transposeNote(state.midiEvents[0].note));
          midiScheduleWindow();
          return;
        }
        stopAuto();
        document.getElementById("status").textContent =
          "结束 · 《" + state.currentSong.name + "》";
      }, endIn * 1000);
      return;
    }

    const busy = scheduledInRound >= 6 || voicePressureLevel() >= 1;
    const nextPollMs = busy ? MIDI_POLL_MS_BUSY : MIDI_POLL_MS;
    state.midiRaf = setTimeout(midiScheduleWindow, nextPollMs);
  }

  /**
   * 主动回收：这是你提出的方案——每播过一定数量的音符，就自动做一次
   * 「相当于暂停再恢复」的动作，把攒了一路的音频节点/引用清空重建，
   * 而不是等它攒到卡顿才靠手动暂停来救。
   * 用旧 audioCtx 先算好当前拍位置，再整体换新音频图，最后从原拍位置续播，
   * 曲谱进度和调式不受影响。换图改用 rebuildAudioGraphCrossfade()：旧图不摁停、
   * 悄悄留几秒让正在响的音符自然放完再关闭，新音符从这一刻起排到新图上，
   * 不会再出现「正在响的和弦被硬切断」那种能听出来的卡顿。
   * （唯一的小代价：若这一刻正好踩着延音踏板，旧图里那些延音音符不再跟随
   * 之后的抬踏板动作提前淡出，而是按自身包络自然放完——影响很小，可接受。）
   */
  const AUTO_RECYCLE_NOTE_STEP = IS_LOW_POWER ? 220 : 380;
  function maybeAutoRecycleAudioGraph() {
    if (state.autoRecycleInProgress) return false;
    if (!state.midiPlaying || !state.isPlaying || state.isPaused) return false;
    if (state.audioSessionNoteCount - state.lastRecycleNoteCount < AUTO_RECYCLE_NOTE_STEP) return false;
    state.lastRecycleNoteCount = state.audioSessionNoteCount;
    performAutoRecycle();
    return true;
  }

  function performAutoRecycle() {
    if (state.autoRecycleInProgress) return;
    if (!state.midiPlaying || !state.isPlaying || state.isPaused || !state.audioCtx || !state.midiEvents) return;
    state.autoRecycleInProgress = true;
    try {
      const nowBeat = midiNowBeat(); // 必须在换 audioCtx 之前算，否则拍位置会跳回 0
      state.midiTimerIds.forEach(function (id) { clearTimeout(id); });
      state.midiTimerIds = [];
      if (state.midiEndTimer) { clearTimeout(state.midiEndTimer); state.midiEndTimer = null; }
      if (state.midiRaf) { clearTimeout(state.midiRaf); state.midiRaf = null; }
      rebuildAudioGraphCrossfade();
      state.midiBeatOffset = Number.isFinite(nowBeat) ? nowBeat : state.midiBeatOffset;
      state.midiAbsStart = state.audioCtx.currentTime + 0.05;
      // 注意：这里不能再像硬切版本那样把 midiNextIndex 倒回 nowBeat 对应的位置重排——
      // 旧图现在不会被摧毁，lookahead 窗口内那些已经排给旧图、还没真正响的音符依然会
      // 按原计划正常播放；倒回去重排等于把它们在新图上又排了一遍，变成同一个音响两次。
      // 交叉版本下 midiNextIndex 不需要动，直接从"还没排过"的下一个音符继续往后排即可。
    } catch (e) {
      console.error("自动回收音频图失败，将继续原有调度:", e);
    } finally {
      state.autoRecycleInProgress = false;
    }
    midiScheduleWindow();
  }

  /** 从当前播放位置按新速度重排（未播事件） */
  function midiRescheduleFromNow() {
    if (!state.midiPlaying || !state.midiEvents || !state.audioCtx) return;
    // 冻结当前拍位置
    const nowBeat = midiNowBeat();
    state.midiBeatOffset = nowBeat;
    state.midiAbsStart = state.audioCtx.currentTime;
    // 清掉尚未触发的窗口定时器，保留索引（跳过已调度下标之前的）
    state.midiTimerIds.forEach(function (id) { clearTimeout(id); });
    state.midiTimerIds = [];
    if (state.midiEndTimer) { clearTimeout(state.midiEndTimer); state.midiEndTimer = null; }
    if (state.midiRaf) { clearTimeout(state.midiRaf); state.midiRaf = null; }
    // 若 nextIndex 超前过多，回退到第一个 beat >= nowBeat - 小容差 的事件
    let i = 0;
    while (i < state.midiEvents.length && state.midiEvents[i].beat < nowBeat - 0.01) i++;
    state.midiNextIndex = i;
    midiScheduleWindow();
  }

  function startMidiPlayback(fromBeat) {
    if (!state.midiEvents || !state.midiEvents.length || !state.audioCtx) return;
    clearMidiTimers();
    state.lastRecycleNoteCount = state.audioSessionNoteCount;
    state.midiPlaying = true;
    const startBeat = Number.isFinite(fromBeat) && fromBeat > 0 ? fromBeat : 0;
    state.midiBeatOffset = startBeat;
    let i = 0;
    while (i < state.midiEvents.length && state.midiEvents[i].beat < startBeat - 0.01) i++;
    state.midiNextIndex = i;
    state.midiAbsStart = state.audioCtx.currentTime + 0.12;
    const previewEv = state.midiEvents[state.midiNextIndex] || state.midiEvents[state.midiEvents.length - 1];
    if (previewEv) showPreview(transposeNote(previewEv.note));
    midiScheduleWindow();
  }

  // ========== 5. 自动演奏调度 ==========
  const LOOKAHEAD = 0.15, SCHEDULE_MS = 20;
  function beatDuration() { return midiBeatSec(); }

  function updateTransportButtons() {
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    if (!playBtn || !pauseBtn) return;
    if (state.isPlaying && !state.isPaused) {
      playBtn.classList.add("active");
      playBtn.textContent = "♪ 演奏中";
      pauseBtn.disabled = false;
      pauseBtn.classList.remove("active");
      pauseBtn.textContent = "⏸ 暂停";
    } else if (state.isPaused) {
      playBtn.classList.remove("active");
      playBtn.textContent = "▶ 继续";
      pauseBtn.disabled = false;
      pauseBtn.classList.add("active");
      pauseBtn.textContent = "⏸ 已暂停";
    } else {
      playBtn.classList.remove("active");
      playBtn.textContent = "▶ 开始";
      pauseBtn.disabled = true;
      pauseBtn.classList.remove("active");
      pauseBtn.textContent = "⏸ 暂停";
    }
  }

  /** 序列化当前可持久化 UI 设置 */
  function snapshotUiState() {
    return {
      tempo: state.tempo,
      mainVol: Math.round(state.mainVol * 100),
      chordVol: Math.round(state.chordVol * 100),
      reverb: Math.round(state.reverbAmount * 100),
      pedalEnabled: !!state.pedalEnabled,
      showNoteNames: !!state.showNoteNames,
      expressionEnabled: !!state.expressionEnabled,
      loopEnabled: !!state.loopEnabled,
      songId: state.currentSong && state.currentSong.id ? state.currentSong.id : null
    };
  }

  function saveUiStateImmediate() {
    Store.set(STORAGE_KEYS.ui, snapshotUiState());
  }

  /** 防抖写入，滑条拖动时减少 localStorage 压力 */
  function saveUiState() {
    if (state._uiSaveTimer) clearTimeout(state._uiSaveTimer);
    state._uiSaveTimer = setTimeout(function () {
      state._uiSaveTimer = null;
      saveUiStateImmediate();
    }, 180);
  }

  function savePlayState() {
    if (!state.isPaused && !state.isPlaying) {
      Store.remove(STORAGE_KEYS.play);
      return;
    }
    Store.set(STORAGE_KEYS.play, {
      songId: state.currentSong && state.currentSong.id ? state.currentSong.id : null,
      isPaused: !!state.isPaused,
      melodyIndex: state.melodyIndex,
      chordIndex: state.chordIndex,
      beatCount: state.beatCount,
      midiBeat: (state.midiEvents && state.midiEvents.length)
        ? (state.isPaused ? state.pausedMidiBeat : midiNowBeat())
        : 0,
      tempo: state.tempo
    });
  }

  function clearPlayState() {
    Store.remove(STORAGE_KEYS.play);
  }

  function loadUiState() {
    return Store.get(STORAGE_KEYS.ui, null);
  }

  function loadPlayState() {
    return Store.get(STORAGE_KEYS.play, null);
  }

  /** 把已解析的 UI 快照应用到 state + DOM（恢复会话用） */
  function applyUiSnapshot(ui) {
    if (!ui || typeof ui !== "object") return;

    if (Number.isFinite(ui.tempo)) {
      state.tempo = clamp(ui.tempo, 50, 160);
      const te = document.getElementById("tempo");
      const tv = document.getElementById("tempoVal");
      if (te) te.value = state.tempo;
      if (tv) tv.textContent = state.tempo;
    }
    if (Number.isFinite(ui.mainVol)) {
      state.mainVol = clamp(ui.mainVol / 100, 0, 1);
      const el = document.getElementById("volMain");
      const vl = document.getElementById("volMainVal");
      const pct = Math.round(state.mainVol * 100);
      if (el) el.value = pct;
      if (vl) vl.textContent = pct;
    }
    if (Number.isFinite(ui.chordVol)) {
      state.chordVol = clamp(ui.chordVol / 100, 0, 1);
      const el = document.getElementById("volChord");
      const vl = document.getElementById("volChordVal");
      const pct = Math.round(state.chordVol * 100);
      if (el) el.value = pct;
      if (vl) vl.textContent = pct;
    }
    if (Number.isFinite(ui.reverb)) {
      state.reverbAmount = clamp(ui.reverb / 100, 0, 1);
      const el = document.getElementById("reverb");
      const vl = document.getElementById("reverbVal");
      const pct = Math.round(state.reverbAmount * 100);
      if (el) el.value = pct;
      if (vl) vl.textContent = pct;
    }
    if (typeof ui.pedalEnabled === "boolean") {
      state.pedalEnabled = ui.pedalEnabled;
      const el = document.getElementById("pedalToggle");
      if (el) el.checked = state.pedalEnabled;
    }
    if (typeof ui.showNoteNames === "boolean") {
      state.showNoteNames = ui.showNoteNames;
      const el = document.getElementById("nameToggle");
      if (el) el.checked = state.showNoteNames;
      document.body.classList.toggle("hide-note-names", !state.showNoteNames);
    }
    if (typeof ui.expressionEnabled === "boolean") {
      state.expressionEnabled = ui.expressionEnabled;
      const el = document.getElementById("exprToggle");
      if (el) el.checked = state.expressionEnabled;
    }
    if (typeof ui.loopEnabled === "boolean") {
      state.loopEnabled = ui.loopEnabled;
      const el = document.getElementById("loopToggle");
      if (el) el.checked = state.loopEnabled;
    }
    if (ui.songId) {
      const found = SONG_LIBRARY.find(function (s) { return s.id === ui.songId; });
      if (found) {
        applySongContent(found);
        const st = document.getElementById("status");
        if (st) st.textContent = "就绪 · 《" + found.name + "》";
      }
    }
  }

  /** 恢复暂停位点（仅当 playState 指向有效曲目） */
  function applyPlaySnapshot(ps) {
    if (!ps || !ps.isPaused || !ps.songId) return false;
    const found = SONG_LIBRARY.find(function (s) { return s.id === ps.songId; });
    if (!found) {
      clearPlayState();
      return false;
    }
    if (!state.currentSong || state.currentSong.id !== found.id) {
      applySongContent(found);
    }
    state.isPaused = true;
    state.isPlaying = false;
    if (Number.isFinite(ps.tempo)) state.tempo = clamp(ps.tempo, 50, 160);
    if (state.midiEvents && state.midiEvents.length) {
      state.pausedMidiBeat = Number.isFinite(ps.midiBeat) ? ps.midiBeat : 0;
    } else {
      state.pausedMelodyIndex = ps.melodyIndex || 0;
      state.pausedChordIndex = ps.chordIndex || 0;
      state.pausedBeatCount = ps.beatCount || 0;
      state.melodyIndex = state.pausedMelodyIndex;
      state.chordIndex = state.pausedChordIndex;
      state.beatCount = state.pausedBeatCount;
    }
    setStatus(statusMsg("paused-restore"));
    return true;
  }

  (function syncInitialTempo() {
    state.tempo = (state.currentSong && state.currentSong.tempo) || SETTINGS_DEFAULTS.tempo;
    const tempoEl = document.getElementById("tempo");
    const tempoValEl = document.getElementById("tempoVal");
    if (tempoEl) tempoEl.value = state.tempo;
    if (tempoValEl) tempoValEl.textContent = state.tempo;
  })();

  function showPreview(note) {
    if (state.previewNote && state.previewNote !== note) {
      const old = keyEl(state.previewNote);
      if (old) {
        old.classList.remove("next");
        if (!old.classList.contains("active")) highlightedNotes.delete(state.previewNote);
      }
    }
    state.previewNote = (note && note !== "-" && note !== "rest") ? note : null;
    if (state.previewNote) {
      const el = keyEl(state.previewNote);
      if (el && !el.classList.contains("active")) {
        el.classList.add("next");
        highlightedNotes.add(state.previewNote);
      }
      if (state.isPlaying) {
        const notes = [state.previewNote];
        highlightedNotes.forEach(function (name) {
          if (name !== state.previewNote) notes.push(name);
        });
        centerOnNotes(notes);
      }
    }
  }
  function clearPreview() {
    if (state.previewNote) {
      const el = keyEl(state.previewNote);
      if (el) {
        el.classList.remove("next");
        if (!el.classList.contains("active")) highlightedNotes.delete(state.previewNote);
      }
      state.previewNote = null;
    }
  }

  /** 调度一拍：旋律、预备高亮、小节和弦与踏板 */
  function scheduleBeat(beatTime, beatInBar) {
    const note = state.loopEnabled ? state.melody[state.melodyIndex % state.melody.length] : state.melody[state.melodyIndex];
    const nextNote = state.loopEnabled
      ? state.melody[(state.melodyIndex + 1) % state.melody.length]
      : (state.melodyIndex + 1 < state.melody.length ? state.melody[state.melodyIndex + 1] : null);
    if (note) {
      const phraseEnd = (state.melodyIndex % 8 === 7);
      const dur = (note === "-" || note === "rest") ? 0.2 : (phraseEnd ? 0.5 : 0.28);
      const delayToNow = Math.max(0, (beatTime - state.audioCtx.currentTime) * 1000);
      setTimeout(() => { clearPreview(); showPreview(transposeNote(nextNote)); }, delayToNow);
      if (note !== "-" && note !== "rest") {
        const humanT = (Math.random() - 0.5) * 0.012;
        const expr = expressionAt(state.melodyIndex);
        const humanV = state.mainVol * (0.82 + Math.random() * 0.14) * expr;
        try {
          playNote(transposeNote(note), dur, humanV, beatTime + humanT, { scroll: true });
        } catch (ePlay) {}
      }
    }
    state.melodyIndex++;

    if (beatInBar === 0 && state.chordOrder.length) {
      const name = state.chordOrder[state.chordIndex % state.chordOrder.length];
      const notes = state.chords[name] || [];
      setStatus(statusMsg("default", name + " · 第 " + (Math.floor(state.beatCount / 4) + 1) + " 小节"));
      setPedal(false);
      const pedalOnAt = beatTime + 0.04;
      const delayPedal = Math.max(0, (pedalOnAt - state.audioCtx.currentTime) * 1000);
      setTimeout(function () { if (state.isPlaying) setPedal(true); }, delayPedal);
      notes.forEach(function (n, i) {
        const humanDelay = i * 0.055 + Math.random() * 0.012;
        try {
          playNote(transposeNote(n), 1.05, state.chordVol * 0.48, beatTime + humanDelay, { scroll: false });
        } catch (eChord) {}
      });
      state.chordIndex++;
    }
  }

  function scheduler() {
    try {
      schedulerImpl();
    } catch (e) {
      // 心跳保护：与 midiScheduleWindow 同理，调度过程中任何未预期的异常
      // 都不能让非 MIDI（旋律/和弦）自动演奏彻底卡死。
      console.error("scheduler 异常，已捕获并尝试自愈:", e);
      if (state.isPlaying) {
        if (state.timerId) { clearTimeout(state.timerId); }
        state.timerId = setTimeout(scheduler, SCHEDULE_MS);
      }
    }
  }

  function schedulerImpl() {
    if (!state.isPlaying || !state.audioCtx) return;
    const now = state.audioCtx.currentTime;
    while (state.nextBeatTime < now + LOOKAHEAD) {
      // 非循环：旋律播完一轮后停止；melody 被清空（如曲目被删除）时也应停止，
      // 而不是陷入静默空转的死循环
      if (!state.loopEnabled && (!state.melody.length || state.melodyIndex >= state.melody.length)) {
        const endIn = Math.max(0.15, (state.nextBeatTime - now) * 1000 + 400);
        setTimeout(function () {
          if (!state.isPlaying) return;
          stopAuto();
          document.getElementById("status").textContent =
            "结束 · 《" + state.currentSong.name + "》";
        }, endIn);
        return;
      }
      scheduleBeat(state.nextBeatTime, state.beatCount % 4);
      state.nextBeatTime += beatDuration();
      state.beatCount++;
    }
    state.timerId = setTimeout(scheduler, SCHEDULE_MS);
  }

  function ensurePlayableSong() {
    var hasMidi = state.midiEvents && state.midiEvents.length;
    var hasMel = state.melody && state.melody.length;
    if (hasMidi || hasMel) return true;
    // 曲库被清空或当前曲无内容时，回退到第一首有内容的
    for (var i = 0; i < SONG_LIBRARY.length; i++) {
      var s = SONG_LIBRARY[i];
      if (!s) continue;
      if ((s.midiEvents && s.midiEvents.length) || (s.melody && s.melody.length)) {
        loadSong(s);
        return !!(state.midiEvents && state.midiEvents.length) || !!(state.melody && state.melody.length);
      }
    }
    return false;
  }

  async function startAuto(opts) {
    opts = opts || {};
    if (state.isPaused && !opts.fromStart) {
      return resumeFromPause();
    }
    if (state.isPlaying || state.startAutoLock) return;
    state.startAutoLock = true;
    try {
      if (!ensurePlayableSong()) {
        setStatus(statusMsg("need-song"));
        return;
      }
      if (!Number.isFinite(Number(state.tempo)) || Number(state.tempo) <= 0) {
        syncTempoUI((state.currentSong && state.currentSong.tempo) || SETTINGS_DEFAULTS.tempo);
      }
      const resumePos = opts.resumePos || null;
      if (state.midiEvents && state.midiEvents.length) {
        await resumeAudio();
        if (state.isPlaying) return;
        state.isPlaying = true;
        state.isPaused = false;
        try { if (window.leafFx) window.leafFx.sync(); } catch (e) {}
        clearAllHighlights();
        clearPreview();
        setPedal(state.pedalEnabled);
        setStatus(statusMsg("midi"));
        updateTransportButtons();
        startMidiPlayback(resumePos && Number.isFinite(resumePos.midiBeat) ? resumePos.midiBeat : 0);
        savePlayState();
        return;
      }
      if (!state.melody.length) {
        setStatus(statusMsg("need-song"));
        return;
      }
      await resumeAudio();
      if (state.isPlaying) return;
      if (!state.audioCtx) {
        setStatus(statusMsg("audio-retry"));
        return;
      }
      state.isPlaying = true;
      state.isPaused = false;
      try { if (window.leafFx) window.leafFx.sync(); } catch (e) {}
      clearAllHighlights();
      clearPreview();
      state.nextBeatTime = state.audioCtx.currentTime + 0.12;
      if (resumePos) {
        state.melodyIndex = resumePos.melodyIndex || 0;
        state.chordIndex = resumePos.chordIndex || 0;
        state.beatCount = resumePos.beatCount || 0;
      } else {
        state.beatCount = 0; state.melodyIndex = 0; state.chordIndex = 0;
      }
      if (!state.expressionCurve.length) state.expressionCurve = buildExpressionCurve(state.melody);
      const nextN = state.melody[state.melodyIndex];
      showPreview(transposeNote((nextN && nextN !== "-" && nextN !== "rest") ? nextN :
        (state.melody.find(function (n) { return n !== "-" && n !== "rest"; }) || null)));
      setPedal(false);
      updateTransportButtons();
      scheduler();
      savePlayState();
    } catch (err) {
      console.warn("startAuto failed", err);
      state.isPlaying = false;
      state.isPaused = false;
      setStatus(statusMsg("start-fail"));
      updateTransportButtons();
    } finally {
      state.startAutoLock = false;
    }
  }

  function pauseAuto() {
    if (!state.isPlaying || state.isPaused) return;
    try { if (window.leafFx) window.leafFx.sync(); } catch (e) {}
    capturePausePosition();
    state.isPaused = true;
    state.isPlaying = false;
    clearAllPlaybackTimers();
    setPedal(false);
    if (state.sustainedGains.length) fadeAndDropGains(state.sustainedGains, 0.2);
    if (state.resonanceGains.length) fadeAndDropGains(state.resonanceGains, 0.25);
    state.sustainedGains = [];
    state.resonanceGains = [];
    state.activeVoiceLoad = 0;
    setStatus(statusMsg("paused"));
    updateTransportButtons();
    savePlayState();
    saveUiState();
  }

  async function resumeFromPause() {
    if (!state.isPaused || state.startAutoLock) return;
    const pos = getResumePosition();
    state.isPaused = false;
    await startAuto({ resumePos: pos });
  }

  function stopAuto() {
    state.isPlaying = false;
    state.isPaused = false;
    state.autoPausedByHidden = false;
    try { if (window.leafFx) window.leafFx.clear(); } catch (e) {}
    resetPlayPosition();
    clearAllPlaybackTimers();
    clearAllHighlights();
    clearPreview();
    setPedal(false);
    state.pedalDown = false;
    if (state.sustainedGains.length) fadeAndDropGains(state.sustainedGains, 0.25);
    if (state.resonanceGains.length) fadeAndDropGains(state.resonanceGains, 0.3);
    state.sustainedGains = [];
    state.resonanceGains = [];
    state.activeVoiceLoad = 0;
    if (state.audioCtx && state.masterGain && state.dryGain && state.wetGain) {
      try {
        const now = state.audioCtx.currentTime;
        state.masterGain.gain.cancelScheduledValues(now);
        state.masterGain.gain.setValueAtTime(0.92, now);
        state.dryGain.gain.cancelScheduledValues(now);
        state.dryGain.gain.setValueAtTime(0.88 - state.reverbAmount * 0.35, now);
        state.wetGain.gain.cancelScheduledValues(now);
        state.wetGain.gain.setValueAtTime(0.05 + state.reverbAmount * 0.7, now);
      } catch (eGain) {}
    }
    if (state.audioCtx && (state.audioSessionNoteCount > AUDIO_REBUILD_THRESHOLD || state.audioCtx.state !== "running")) {
      rebuildAudioGraph();
    }
    updateTransportButtons();
    setStatus(statusMsg("stopped"));
    clearPlayState();
    saveUiState();
  }

  // ========== 6. 选曲与自定义谱 ==========
  /** 切换当前曲目并重置演奏状态 */
  function loadSong(song) {
    if (!song) return;
    stopAuto();
    applySongContent(song);
    syncTempoUI(song.tempo != null ? song.tempo : SETTINGS_DEFAULTS.tempo);
    setStatus(statusMsg("selected"));
    document.querySelectorAll(".song-item").forEach(function (el) {
      el.classList.toggle("selected", el.dataset.id === song.id);
    });
    try { renderSongListToggle(); } catch (e) {}
    var first = null;
    if (state.midiEvents && state.midiEvents[0]) first = state.midiEvents[0].note;
    else if (state.melody && state.melody.length) {
      first = state.melody.find(function (n) { return n !== "-" && n !== "rest"; });
    }
    if (first) setTimeout(function () { centerOnNotes([transposeNote(first)]); }, 30);
    var addBtn = $("addMidiToLibBtn") || document.getElementById("addMidiToLibBtn");
    if (addBtn) addBtn.disabled = true;
    saveUiState();
  }

  /** 解析自定义音名序列（支持休止 - / rest） */

  /** 根据旋律推断大调主音 */
  function guessMajorRoot(notes) {
    const pcCount = new Array(12).fill(0);
    notes.forEach(function (n) {
      if (!n || n === "-" || n === "rest") return;
      for (let i = 0; i < ALL_KEYS.length; i++) {
        if (ALL_KEYS[i].name === n) { pcCount[ALL_KEYS[i].midi % 12]++; break; }
      }
    });
    const major = [1, 0, 0.6, 0, 0.8, 0.7, 0, 0.9, 0, 0.5, 0, 0.4];
    let best = 0, bestScore = -1;
    for (let root = 0; root < 12; root++) {
      let s = 0;
      for (let i = 0; i < 12; i++) s += pcCount[i] * major[(i - root + 12) % 12];
      if (s > bestScore) { bestScore = s; best = root; }
    }
    return best;
  }

  function buildDiatonicChords(rootPc) {
    function pcName(pc) { return NOTE_NAMES[((pc % 12) + 12) % 12]; }
    function chord(root, third, fifth, bassOct, midOct) {
      const arr = [
        pcName(root) + bassOct,
        pcName(third) + midOct,
        pcName(fifth) + midOct
      ];
      return arr.filter(function (nm) { return !!freqMap[nm]; });
    }
    const I = rootPc, IV = rootPc + 5, V = rootPc + 7, vi = rootPc + 9;
    return {
      chords: {
        "I": chord(I, I + 4, I + 7, "2", "3"),
        "IV": chord(IV, IV + 4, IV + 7, "2", "3"),
        "V": chord(V, V + 4, V + 7, "2", "3"),
        "vi": chord(vi, vi + 3, vi + 7, "2", "3")
      },
      chordOrder: ["I", "I", "IV", "I", "IV", "I", "V", "I"]
    };
  }

  function parseCustomNotes(text) {
    return text
      .replace(/,/g, " ")
      .split(/\s+/)
      .map(s => s.trim())
      .filter(Boolean)
      .map(s => {
        if (s === "-" || s.toLowerCase() === "rest" || s === "0") return "-";
        // 允许 c4 / C4
        const m = s.match(/^([A-Ga-g])([#b]?)(\d)$/);
        if (!m) return null;
        let name = m[1].toUpperCase() + (m[2] === "b" ? "b" : m[2]) + m[3];
        // 简单降号转升号：Db->C#, Eb->D#, Gb->F#, Ab->G#, Bb->A#
        const flats = { "Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#" };
        const base = name.slice(0, -1);
        if (flats[base]) name = flats[base] + name.slice(-1);
        return freqMap[name] ? name : null;
      })
      .filter(n => n !== null);
  }

  function songNoteCount(song) {
    if (song.midiEvents && song.midiEvents.length) return song.midiEvents.length;
    if (song.melody && song.melody.length) return song.melody.filter(function (n) { return n !== "-" && n !== "rest"; }).length;
    return 0;
  }


  function canUseSavePicker() {
    // 需安全上下文（https / localhost）；file:// 下 Chrome 不可用
    return typeof window.showSaveFilePicker === "function" && window.isSecureContext;
  }

  function downloadJson(filename, dataObj) {
    let json;
    try {
      json = JSON.stringify(dataObj, null, 2);
    } catch (e) {
      customAlert("导出失败（序列化）：" + (e && e.message ? e.message : e));
      return;
    }
    // octet-stream：Chrome 更倾向触发下载，而不是在标签页里打开 JSON
    const blob = new Blob([json], { type: "application/octet-stream" });

    if (canUseSavePicker()) {
      // 必须在用户点击的同步调用栈里启动 picker，Chrome 才会放行
      window.showSaveFilePicker({
        suggestedName: filename,
        types: [{
          description: "JSON 曲库",
          accept: { "application/json": [".json"] }
        }]
      }).then(function (handle) {
        return handle.createWritable().then(function (writable) {
          return writable.write(blob).then(function () { return writable.close(); });
        });
      }).catch(function (e) {
        if (e && e.name === "AbortError") return;
        // 回退：部分环境 picker 报错，改用锚点下载
        downloadJsonViaAnchor(filename, blob);
      });
      return;
    }

    downloadJsonViaAnchor(filename, blob);
  }

  function downloadJsonViaAnchor(filename, blob) {
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.setAttribute("download", filename);
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      // 同步触发，尽量保留用户手势（Chrome 对延迟下载可能拦截）
      if (typeof a.click === "function") a.click();
      else a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
      // 大文件需更久才开始下载，过早 revoke 会让 Chrome 下载失败/损坏
      setTimeout(function () {
        try { URL.revokeObjectURL(url); } catch (e) {}
        try { a.remove(); } catch (e) {}
      }, 5000);
    } catch (e) {
      customAlert("导出失败：" + (e && e.message ? e.message : e));
    }
  }

  function songToExport(song) {
    return songToSnapshot(song);
  }

  function exportOneSong(song) {
    const safe = (song.name || "song").replace(/[\\\\/:*?"<>|]/g, "_").slice(0, 40);
    downloadJson("piano-" + safe + ".json", {
      format: "autoPiano.song.v1",
      exportedAt: new Date().toISOString(),
      song: songToExport(song)
    });
  }

  function exportAllLibrary() {
    if (!SONG_LIBRARY.length) {
      customAlert("曲库为空");
      return;
    }
    downloadJson("auto-piano-library.json", {
      format: "autoPiano.library.v1",
      exportedAt: new Date().toISOString(),
      songs: serializeLibrary(SONG_LIBRARY)
    });
  }

  function importLibraryFromJson(obj) {
    let songs = [];
    if (obj && obj.format === "autoPiano.library.v1" && Array.isArray(obj.songs)) {
      songs = obj.songs;
    } else if (obj && obj.format === "autoPiano.song.v1" && obj.song) {
      songs = [obj.song];
    } else if (Array.isArray(obj)) {
      songs = obj;
    } else if (obj && (obj.id || obj.name || obj.nameEn)) {
      songs = [obj];
    } else {
      throw new Error("无法识别的 JSON 格式");
    }
    let added = 0;
    songs.forEach(function (s) {
      const entry = normalizeSongEntry(s, "import");
      if (!entry) return;
      const exist = SONG_LIBRARY.findIndex(function (x) { return x.id === entry.id; });
      if (exist >= 0) SONG_LIBRARY[exist] = entry;
      else SONG_LIBRARY.push(entry);
      added++;
    });
    if (!added) throw new Error("文件中没有有效曲目");
    saveLibraryToStorage();
    renderSongList();
    return added;
  }


  function renderSongListToggle() {
    const toggle = document.getElementById("songListToggle");
    if (!toggle) return;
    if (!SONG_LIBRARY.length) { toggle.innerHTML = ""; return; }
    toggle.classList.toggle("expanded", state.songListExpanded);
    toggle.innerHTML = (state.songListExpanded
      ? "收起"
      : "《" + escapeHtml(state.currentSong.name) + "》 · " + SONG_LIBRARY.length + " 首") +
      ' <span class="chevron">▾</span>';
    toggle.onclick = function () {
      state.songListExpanded = !state.songListExpanded;
      renderSongList();
    };
  }

  function renderSongList() {
    renderSongListToggle();
    const list = document.getElementById("songList");
    list.innerHTML = "";
    if (!SONG_LIBRARY.length) {
      list.innerHTML = "<p style=\"font-size:0.6rem;color:var(--muted);padding:6px 0\">曲库空，请导入或输入</p>";
      return;
    }
    const sorted = SONG_LIBRARY.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
    });
    const visible = state.songListExpanded
      ? sorted
      : sorted.filter(function (s) { return s.id === state.currentSong.id; }).slice(0, 1).length
        ? sorted.filter(function (s) { return s.id === state.currentSong.id; })
        : sorted.slice(0, 1);
    visible.forEach(function (song) {
      const idx = sorted.indexOf(song);
      const row = document.createElement("div");
      row.className = "song-item" + (song.id === state.currentSong.id ? " selected" : "");
      row.dataset.id = song.id;

      // 原始英文名始终保留在 nameEn；中文展示用 nameZh + showZh 开关
      if (!song.nameEn) song.nameEn = song.name;
      const displayName = song.showZh && song.nameZh ? song.nameZh : song.nameEn;
      const count = songNoteCount(song);
      const kind = song.midiEvents ? "MIDI" : "曲谱";

      const meta = document.createElement("div");
      meta.className = "song-meta";
      meta.innerHTML = (idx + 1) + ". " + escapeHtml(displayName) + "<small>" + escapeHtml(song.desc || kind) + " · " + (song.tempo || 92) + " BPM · " + count + " 音</small>";
      meta.addEventListener("click", function () {
        loadSong(song);
        closeSongModal();
      });

      const actions = document.createElement("div");
      actions.className = "song-actions";

      const zhBtn = document.createElement("button");
      zhBtn.type = "button";
      zhBtn.className = "zh-song" + (song.showZh ? " active" : "");
      zhBtn.textContent = song.showZh ? "英" : "中";
      zhBtn.title = song.showZh ? "英文" : "中文名";
      zhBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (song.showZh) {
          song.showZh = false;
          song.name = song.nameEn || song.name;
        } else {
          if (!song.nameZh) {
            const hit = lookupSongZh(song.nameEn || song.name);
            if (!hit) {
              customAlert("无常用中文译名，可手动改名");
              return;
            }
            song.nameZh = hit;
          }
          if (!song.nameEn) song.nameEn = song.name;
          song.showZh = true;
          song.name = song.nameZh;
        }
        // 若是当前曲，同步状态栏与侧栏标题
        if (state.currentSong && state.currentSong.id === song.id) {
          state.currentSong.name = song.name;
          state.currentSong.showZh = song.showZh;
          state.currentSong.nameZh = song.nameZh;
          state.currentSong.nameEn = song.nameEn;
          const st = document.getElementById("status");
          if (st && st.textContent && st.textContent.indexOf("《") >= 0) {
            st.textContent = st.textContent.replace(/《[^》]*》/, "《" + song.name + "》");
          }
        }
        try { saveLibraryToStorage(); } catch (err) {}
        renderSongList();
      });

      const exp = document.createElement("button");
      exp.type = "button";
      exp.className = "exp-song";
      exp.textContent = "导出";
      exp.title = "导出";
      exp.addEventListener("click", function (e) {
        e.stopPropagation();
        exportOneSong(song);
      });

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-song";
      del.textContent = "删除";
      del.title = "删除";
      del.addEventListener("click", async function (e) {
        e.stopPropagation();
        const ok = await customConfirm("确定从曲库删除《" + (song.nameEn || song.name) + "》？");
        if (!ok) return;
        const idx = SONG_LIBRARY.findIndex(function (s) { return s.id === song.id; });
        if (idx < 0) return;
        if (state.currentSong.id === song.id) stopAuto(); // 先停止播放，避免调度器继续引用即将被清空的曲目数据
        SONG_LIBRARY.splice(idx, 1);
        saveLibraryToStorage();
        if (state.currentSong.id === song.id) {
          if (SONG_LIBRARY.length) loadSong(SONG_LIBRARY[0]);
          else {
            applySongContent(emptySongPlaceholder());
            setStatus(statusMsg("empty-lib"));
          }
        }
        renderSongList();
      });

      actions.appendChild(zhBtn);
      actions.appendChild(exp);
      actions.appendChild(del);
      row.appendChild(meta);
      row.appendChild(actions);
      list.appendChild(row);
    });
  }

  /** 主 Tab：曲库 | 添加曲目 */
  function setModalMainTab(tab) {
    state.modalMainTab = tab === "add" ? "add" : "library";
    document.querySelectorAll("#modalMainTabs .tab").forEach(function (btn) {
      var on = btn.getAttribute("data-main-tab") === state.modalMainTab;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.querySelectorAll(".modal-pane").forEach(function (pane) {
      pane.classList.toggle("active", pane.getAttribute("data-main-pane") === state.modalMainTab);
    });
    if (state.modalMainTab === "library") renderSongList();
  }

  /** 添加子 Tab：简谱 | MIDI | 哼唱 */
  function setModalAddTab(tab) {
    if (tab !== "score" && tab !== "midi" && tab !== "listen") tab = "score";
    // 离开哼唱时若仍在收音则停止
    if (state.modalAddTab === "listen" && tab !== "listen" && state.listening) {
      try { stopListening(); } catch (e) {}
      try { resetListenButton(); } catch (e) {}
    }
    state.modalAddTab = tab;
    document.querySelectorAll("#modalAddTabs .subtab").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-add-tab") === tab);
    });
    document.querySelectorAll(".add-pane").forEach(function (pane) {
      pane.classList.toggle("active", pane.getAttribute("data-add-pane") === tab);
    });
  }

  function openSongModal(opts) {
    opts = opts || {};
    state.songListExpanded = false;
    setModalMainTab(opts.mainTab || "library");
    if (opts.addTab) setModalAddTab(opts.addTab);
    renderSongList();
    document.getElementById("songModal").classList.add("show");
  }
  function closeSongModal() {
    if (state.listening) {
      try { stopListening(); } catch (e) {}
      try { resetListenButton(); } catch (e) {}
    }
    document.getElementById("songModal").classList.remove("show");
  }

  // ========== 7. 停止 / 退出 ==========
  function onStopBtn() {
    // 播放中或暂停中都应完整结束，避免暂停后点「结束」无效
    if (state.isPlaying || state.isPaused) stopAuto();
  }
  function resetStopBtn() {
    const btn = document.getElementById("stopBtn");
    if (btn) {
      btn.textContent = "■ 结束";
      btn.classList.remove("exit");
    }
  }

  function doExit() {
    stopAuto();
    resetStopBtn();
    document.getElementById("exitOverlay").classList.add("show");
    // 注：不再调用 window.close()——浏览器只允许脚本关闭"由脚本自己打开"的窗口，
    // 对当前页面基本永远是无效调用；在部分内嵌 WebView（微信/App 容器等）中
    // 还可能引发不可预期的行为，故直接移除，只保留退出遮罩层。

  // ========== 9. 听歌辨谱（本地麦克风 + 自相关基频检测 + 调号识别，全程离线不联网）==========
  function setListenStatus(text, cls) {
    const el = document.getElementById("listenStatus");
    if (!el) return;
    el.textContent = text || "";
    el.className = "sheet-status" + (cls ? " " + cls : "");

  // 灵敏度 1–10 → 软件增益与静音门限
  function getListenGain() {
    const el = document.getElementById("listenSens");
    const v = el ? +el.value : 6;
    // 1→约 1.2x，6→约 4x，10→约 9x
    return 0.6 + v * 0.85;
  }
  function getListenSilenceRms() {
    const el = document.getElementById("listenSens");
    const v = el ? +el.value : 6;
    // 灵敏度越高，门限越低（更易捕捉远距/小声）
    return Math.max(0.0012, 0.014 - v * 0.0012);
  }

  // 经典自相关基频检测：软件增益 + 归一化后算自相关，远距也能识别
  function autoCorrelate(buf, sampleRate, sensGain) {
    const SIZE = buf.length;
    sensGain = sensGain || 1;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    const silenceGate = getListenSilenceRms() * 0.7;
    if (rms < silenceGate) return { freq: -1, rms: rms };

    // 软件放大 + 防止削波
    const boosted = new Float32Array(SIZE);
    let peak = 0.0001;
    for (let i = 0; i < SIZE; i++) {
      const s = buf[i] * sensGain;
      boosted[i] = s;
      if (Math.abs(s) > peak) peak = Math.abs(s);
    }
    const norm = peak > 1 ? 1 / peak : 1;
    for (let i = 0; i < SIZE; i++) boosted[i] *= norm;

    let r1 = 0, r2 = SIZE - 1;
    const thres = 0.15;
    for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(boosted[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(boosted[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    const trimmed = boosted.slice(r1, r2);
    const newSize = trimmed.length;
    if (newSize < 8) return { freq: -1, rms: rms };

    // 只扫人声/旋律常用频段对应的 lag，避免 O(N²) 全量扫描
    let minLag = Math.floor(sampleRate / 1200);
    let maxLag = Math.ceil(sampleRate / 70);
    if (minLag < 2) minLag = 2;
    if (maxLag > newSize - 2) maxLag = newSize - 2;
    if (maxLag <= minLag) return { freq: -1, rms: rms };

    let bestCorr = -1, bestLag = -1;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let sum = 0;
      for (let i = 0; i < newSize - lag; i++) sum += trimmed[i] * trimmed[i + lag];
      if (sum > bestCorr) { bestCorr = sum; bestLag = lag; }
    }
    if (bestLag < minLag) return { freq: -1, rms: rms };

    let c0 = 0, c1 = 0, c2 = 0;
    for (let i = 0; i < newSize - (bestLag - 1); i++) c0 += trimmed[i] * trimmed[i + bestLag - 1];
    for (let i = 0; i < newSize - bestLag; i++) c1 += trimmed[i] * trimmed[i + bestLag];
    for (let i = 0; i < newSize - (bestLag + 1); i++) c2 += trimmed[i] * trimmed[i + bestLag + 1];
    let T0 = bestLag;
    const a = (c0 + c2 - 2 * c1) / 2, b = (c2 - c0) / 2;
    if (a) T0 = T0 - b / (2 * a);
    if (T0 <= 0) return { freq: -1, rms: rms };

    const freq = sampleRate / T0;
    if (freq < 70 || freq > 1200) return { freq: -1, rms: rms };
    return { freq: freq, rms: rms };
  }

  function freqToMidiFloat(freq) { return 69 + 12 * Math.log2(freq / 440); }

  // Krumhansl-Schmuckler 调号识别：把识别出的音高做音级直方图，和大/小调音级权重模板做相关，取相关性最高的调
  const KS_MAJOR = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
  const KS_MINOR = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  function detectKey(midiArr) {
    if (!midiArr.length) return "未知";
    const hist = new Array(12).fill(0);
    midiArr.forEach(function (m) { hist[((m % 12) + 12) % 12]++; });

    function correlate(profile, rotation) {
      let sumH = 0, sumP = 0, sumHH = 0, sumPP = 0, sumHP = 0;
      for (let i = 0; i < 12; i++) {
        const h = hist[i], p = profile[(i - rotation + 12) % 12];
        sumH += h; sumP += p; sumHH += h * h; sumPP += p * p; sumHP += h * p;
      }
      const num = 12 * sumHP - sumH * sumP;
      const den = Math.sqrt((12 * sumHH - sumH * sumH) * (12 * sumPP - sumP * sumP));
      return den ? num / den : 0;
    }

    let best = { score: -Infinity, name: "C 大调" };
    for (let root = 0; root < 12; root++) {
      const sMaj = correlate(KS_MAJOR, root);
      const sMin = correlate(KS_MINOR, root);
      if (sMaj > best.score) best = { score: sMaj, name: NOTE_NAMES[root] + " 大调" };
      if (sMin > best.score) best = { score: sMin, name: NOTE_NAMES[root] + " 小调" };
    }
    return best.name;
  }

  // 听歌辨谱 AudioWorklet：
  // - 环形缓冲 2048 + hop 512（重叠，时间更细）
  // - 一阶高通去低频轰鸣
  // - 自相关只扫 70–1200Hz 对应 lag
  // - 静音不刷屏；有声才 postMessage
  // - 模块按 AudioContext 只加载一次，停录不关 Context，二次收音更快
  const PITCH_WORKLET_SRC = [
    "class PitchProcessor extends AudioWorkletProcessor {",
    "  constructor() {",
    "    super();",
    "    this._gain = 1;",
    "    this._gate = 0.003;",
    "    this._bufSize = 2048;",
    "    this._hop = 512;",
    "    this._buf = new Float32Array(this._bufSize);",
    "    this._write = 0;",
    "    this._filled = 0;",
    "    this._hpPrevIn = 0;",
    "    this._hpPrevOut = 0;",
    "    this._hpR = 0.995;",
    "    this._lastPostedVoiced = false;",
    "    this._silentSkip = 0;",
    "    this.port.onmessage = (e) => {",
    "      if (e.data && e.data.type === 'config') {",
    "        if (typeof e.data.gain === 'number') this._gain = e.data.gain;",
    "        if (typeof e.data.gate === 'number') this._gate = e.data.gate;",
    "      }",
    "    };",
    "  }",
    "  highpass(x) {",
    "    const y = x - this._hpPrevIn + this._hpR * this._hpPrevOut;",
    "    this._hpPrevIn = x;",
    "    this._hpPrevOut = y;",
    "    return y;",
    "  }",
    "  detectPitch(sampleRate) {",
    "    const SIZE = this._bufSize;",
    "    const sensGain = this._gain || 1;",
    "    const gate = this._gate * 0.7;",
    "    let rms = 0;",
    "    const start = this._write;",
    "    for (let i = 0; i < SIZE; i++) {",
    "      const s = this._buf[(start + i) % SIZE];",
    "      rms += s * s;",
    "    }",
    "    rms = Math.sqrt(rms / SIZE);",
    "    if (rms < gate) return { freq: -1, rms: rms };",
    "    const boosted = new Float32Array(SIZE);",
    "    let peak = 0.0001;",
    "    for (let i = 0; i < SIZE; i++) {",
    "      const s = this._buf[(start + i) % SIZE] * sensGain;",
    "      boosted[i] = s;",
    "      const a = s < 0 ? -s : s;",
    "      if (a > peak) peak = a;",
    "    }",
    "    const norm = peak > 1 ? 1 / peak : 1;",
    "    for (let i = 0; i < SIZE; i++) boosted[i] *= norm;",
    "    // lag 范围对应约 70–1200 Hz",
    "    let minLag = Math.floor(sampleRate / 1200);",
    "    let maxLag = Math.ceil(sampleRate / 70);",
    "    if (minLag < 2) minLag = 2;",
    "    if (maxLag > SIZE - 2) maxLag = SIZE - 2;",
    "    if (maxLag <= minLag) return { freq: -1, rms: rms };",
    "    let bestCorr = -1, bestLag = -1;",
    "    for (let lag = minLag; lag <= maxLag; lag++) {",
    "      let sum = 0;",
    "      const lim = SIZE - lag;",
    "      for (let i = 0; i < lim; i++) sum += boosted[i] * boosted[i + lag];",
    "      if (sum > bestCorr) { bestCorr = sum; bestLag = lag; }",
    "    }",
    "    if (bestLag < minLag) return { freq: -1, rms: rms };",
    "    // 三点抛物线细化周期",
    "    let c0 = 0, c1 = 0, c2 = 0;",
    "    const lim0 = SIZE - (bestLag - 1), lim1 = SIZE - bestLag, lim2 = SIZE - (bestLag + 1);",
    "    for (let i = 0; i < lim0; i++) c0 += boosted[i] * boosted[i + bestLag - 1];",
    "    for (let i = 0; i < lim1; i++) c1 += boosted[i] * boosted[i + bestLag];",
    "    for (let i = 0; i < lim2; i++) c2 += boosted[i] * boosted[i + bestLag + 1];",
    "    let T0 = bestLag;",
    "    const a = (c0 + c2 - 2 * c1) / 2, b = (c2 - c0) / 2;",
    "    if (a) T0 = T0 - b / (2 * a);",
    "    if (T0 <= 0) return { freq: -1, rms: rms };",
    "    const freq = sampleRate / T0;",
    "    if (freq < 70 || freq > 1200) return { freq: -1, rms: rms };",
    "    return { freq: freq, rms: rms };",
    "  }",
    "  process(inputs) {",
    "    const ch = inputs[0] && inputs[0][0];",
    "    if (!ch || !ch.length) return true;",
    "    for (let i = 0; i < ch.length; i++) {",
    "      const y = this.highpass(ch[i]);",
    "      this._buf[this._write] = y;",
    "      this._write = (this._write + 1) % this._bufSize;",
    "      if (this._filled < this._bufSize) this._filled++;",
    "      if (this._filled >= this._bufSize && (this._write % this._hop) === 0) {",
    "        const result = this.detectPitch(sampleRate);",
    "        const voiced = result.freq > 0;",
    "        if (voiced) {",
    "          this.port.postMessage({ type: 'pitch', freq: result.freq, rms: result.rms, t: currentTime });",
    "          this._lastPostedVoiced = true;",
    "          this._silentSkip = 0;",
    "        } else {",
    "          // 静音：仅在「刚结束有声」或每约 8 hop 报一次，供 UI 清空，避免刷屏",
    "          this._silentSkip++;",
    "          if (this._lastPostedVoiced || this._silentSkip >= 8) {",
    "            this.port.postMessage({ type: 'pitch', freq: -1, rms: result.rms, t: currentTime });",
    "            this._lastPostedVoiced = false;",
    "            this._silentSkip = 0;",
    "          }",
    "        }",
    "      }",
    "    }",
    "    return true;",
    "  }",
    "}",
    "registerProcessor('pitch-processor', PitchProcessor);"
  ].join("\n");

  function handlePitchResult(freq, rms, t) {
    state.pitchFrames.push({ t: t, freq: freq, rms: rms });
    const pitchEl = document.getElementById("listenPitch");
    const gate = getListenSilenceRms();
    if (freq > 0 && rms >= gate) {
      const midiRound = Math.round(freqToMidiFloat(freq));
      const name = midiToName(midiRound) || "?";
      pitchEl.textContent = name + "　" + freq.toFixed(0) + " Hz";
    } else {
      pitchEl.textContent = "—";
    }
  }

  async function ensureListenAudioContext() {
    if (state.listenCtx && state.listenCtx.state !== "closed") {
      if (state.listenCtx.state === "suspended") {
        try { await state.listenCtx.resume(); } catch (e) {}
      }
      return state.listenCtx;
    }
    state.listenCtx = new (window.AudioContext || window.webkitAudioContext)();
    state.pitchWorkletModuleReady = false;
    if (state.listenCtx.state === "suspended") {
      try { await state.listenCtx.resume(); } catch (e) {}
    }
    return state.listenCtx;
  }

  async function ensurePitchWorkletModule() {
    if (state.pitchWorkletModuleReady) return;
    if (!state.pitchWorkletBlobUrl) {
      state.pitchWorkletBlobUrl = URL.createObjectURL(
        new Blob([PITCH_WORKLET_SRC], { type: "application/javascript" })
      );
    }
    await state.listenCtx.audioWorklet.addModule(state.pitchWorkletBlobUrl);
    state.pitchWorkletModuleReady = true;
  }

  async function startListeningWorklet(stream) {
    await ensureListenAudioContext();
    await ensurePitchWorkletModule();
    state.listenSourceNode = state.listenCtx.createMediaStreamSource(stream);
    state.listenWorkletNode = new AudioWorkletNode(state.listenCtx, "pitch-processor", {
      numberOfInputs: 1,
      numberOfOutputs: 1,
      channelCount: 1
    });
    state.listenWorkletNode.port.postMessage({ type: "config", gain: getListenGain(), gate: getListenSilenceRms() });
    state.listenWorkletNode.port.onmessage = function (e) {
      if (!state.listening || !e.data || e.data.type !== "pitch") return;
      handlePitchResult(e.data.freq, e.data.rms, e.data.t - state.listenStartTime);
    };
    state.listenMuteGain = state.listenCtx.createGain();
    state.listenMuteGain.gain.value = 0;
    state.listenSourceNode.connect(state.listenWorkletNode);
    state.listenWorkletNode.connect(state.listenMuteGain);
    state.listenMuteGain.connect(state.listenCtx.destination);
    state.listenStartTime = state.listenCtx.currentTime;
    state.listenUsingWorklet = true;
  }

  async function startListeningLegacy(stream) {
    await ensureListenAudioContext();
    state.listenSourceNode = state.listenCtx.createMediaStreamSource(stream);
    state.listenProcessor = state.listenCtx.createScriptProcessor(2048, 1, 1);
    state.listenMuteGain = state.listenCtx.createGain();
    state.listenMuteGain.gain.value = 0;
    state.listenStartTime = state.listenCtx.currentTime;

    const buf = new Float32Array(2048);
    state.listenProcessor.onaudioprocess = function (e) {
      if (!state.listening) return;
      e.inputBuffer.copyFromChannel(buf, 0);
      const result = autoCorrelate(buf, state.listenCtx.sampleRate, getListenGain());
      handlePitchResult(result.freq, result.rms, state.listenCtx.currentTime - state.listenStartTime);
    };

    state.listenSourceNode.connect(state.listenProcessor);
    state.listenProcessor.connect(state.listenMuteGain);
    state.listenMuteGain.connect(state.listenCtx.destination);
    state.listenUsingWorklet = false;
  }

  async function startListening() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: false,
          autoGainControl: true,
          channelCount: 1
        }
      });
    } catch (err) {
      setListenStatus("无法使用麦克风（需 HTTPS/localhost）", "err");
      resetListenButton();
      return;
    }
    state.listenStream = stream;
    state.pitchFrames = [];
    state.listening = true;

    try {
      if (typeof AudioWorkletNode !== "undefined" && window.AudioWorklet) {
        await startListeningWorklet(stream);
        setListenStatus("聆听中…", "busy");
      } else {
        await startListeningLegacy(stream);
        setListenStatus("聆听中…", "busy");
      }
    } catch (e) {
      try {
        if (state.listenWorkletNode) { state.listenWorkletNode.disconnect(); state.listenWorkletNode = null; }
        if (state.listenSourceNode) { state.listenSourceNode.disconnect(); state.listenSourceNode = null; }
        if (state.listenMuteGain) { state.listenMuteGain.disconnect(); state.listenMuteGain = null; }
      } catch (e2) {}
      state.pitchWorkletModuleReady = false;
      try {
        await startListeningLegacy(stream);
        setListenStatus("聆听中（兼容）…", "busy");
      } catch (e3) {
        setListenStatus("启动失败", "err");
        resetListenButton();
        state.listening = false;
        if (state.listenStream) state.listenStream.getTracks().forEach(function (t) { t.stop(); });
        state.listenStream = null;
      }
    }
  }

  function stopListening() {
    state.listening = false;
    if (state.listenWorkletNode) {
      try { state.listenWorkletNode.port.onmessage = null; state.listenWorkletNode.disconnect(); } catch (e) {}
      state.listenWorkletNode = null;
    }
    if (state.listenProcessor) {
      try { state.listenProcessor.disconnect(); state.listenProcessor.onaudioprocess = null; } catch (e) {}
      state.listenProcessor = null;
    }
    if (state.listenSourceNode) { try { state.listenSourceNode.disconnect(); } catch (e) {} state.listenSourceNode = null; }
    if (state.listenMuteGain) { try { state.listenMuteGain.disconnect(); } catch (e) {} state.listenMuteGain = null; }
    if (state.listenStream) {
      try { state.listenStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      state.listenStream = null;
    }
    // 保留 AudioContext 与已加载 Worklet 模块，二次收音更快
    state.listenUsingWorklet = false;
    document.getElementById("listenPitch").textContent = "—";
    processRecordedPitches();
  }

  function processRecordedPitches() {
    if (!state.pitchFrames.length) { setListenStatus("未录到声音", "err"); return; }

    const SILENCE_RMS = getListenSilenceRms();
    const MIN_NOTE_SEC = 0.08;
    const MERGE_GAP_SEC = 0.14;
    const REST_GAP_SEC = 0.2;

    const rawMidi = state.pitchFrames.map(function (f) {
      if (f.freq <= 0 || f.rms < SILENCE_RMS) return null;
      return Math.round(freqToMidiFloat(f.freq));
    });
    // 三点中值平滑，压掉偶发半音跳变
    const midiFrames = rawMidi.map(function (m, i) {
      if (m === null) return null;
      const a = rawMidi[i - 1], b = m, c = rawMidi[i + 1];
      if (a == null || c == null) return b;
      return [a, b, c].sort(function (x, y) { return x - y; })[1];
    });

    // 合并连续同音帧为音符段
    const segments = [];
    let cur = null;
    for (let i = 0; i < midiFrames.length; i++) {
      const m = midiFrames[i], t = state.pitchFrames[i].t;
      if (m === null) {
        if (cur) { segments.push(cur); cur = null; }
        continue;
      }
      if (cur && cur.midi === m) {
        cur.endT = t;
      } else {
        if (cur) segments.push(cur);
        cur = { midi: m, startT: t, endT: t };
      }
    }
    if (cur) segments.push(cur);

    // 丢弃过短抖动段，合并被极短间隙打断的同音段
    const merged = [];
    segments.forEach(function (s) {
      if (s.endT - s.startT < MIN_NOTE_SEC) return;
      const last = merged[merged.length - 1];
      if (last && last.midi === s.midi && (s.startT - last.endT) < MERGE_GAP_SEC) {
        last.endT = s.endT;
      } else {
        merged.push(s);
      }
    });

    if (!merged.length) {
      setListenStatus("未识别到稳定音高，请靠近麦慢唱", "err");
      return;
    }

    const tokens = [];
    for (let i = 0; i < merged.length; i++) {
      if (i > 0 && (merged[i].startT - merged[i - 1].endT) > REST_GAP_SEC) tokens.push("-");
      tokens.push(midiToName(merged[i].midi) || "C4");
    }

    document.getElementById("customNotes").value = tokens.join(" ");
    if (!document.getElementById("customName").value.trim()) {
      document.getElementById("customName").value =
        "哼唱识别 " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    const key = detectKey(merged.map(function (s) { return s.midi; }));
    const noteCount = tokens.filter(function (t) { return t !== "-"; }).length;
    setListenStatus("完成 · " + noteCount + " 音 · " + key + " · 已写入简谱", "ok");
    // 识别结果已写入简谱栏，引导用户到简谱子页确认/编辑
    try { setModalAddTab("score"); } catch (e) {}
  }

  function readFileAsArrayBuffer(file) {
    return new Promise(function (resolve, reject) {
      if (file.size > MAX_MIDI_FILE_BYTES) {
        reject(new Error("文件过大（超过 " + (MAX_MIDI_FILE_BYTES / 1024 / 1024) + "MB）"));
        return;
      }
      const reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error || new Error("读取文件失败")); };
      reader.readAsArrayBuffer(file);
    });
  }
