<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自动弹奏钢琴</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="mapleLeafCanvas" aria-hidden="true"></canvas>

<div class="app-shell">
  <div class="header">
    <h1>自动弹奏钢琴 🐈</h1>
    <div class="header-right">
      <div class="top-actions">
        <button class="btn play" id="playBtn">▶ 开始</button>
        <button class="btn stop" id="stopBtn">■ 结束</button>
        <button class="btn song" id="songBtn">🎵 选曲</button>
        <button type="button" class="btn ctrl-toggle" id="ctrlToggleBtn" title="控制面板" aria-label="控制面板" aria-expanded="false">⚙️ 控制</button>
      </div>
      <div class="credit-tp">TP 制作</div>
    </div>
  </div>

  <div class="piano-stage">
    <div class="status" id="status">准备就绪</div>
    <div class="cat-row">
    <div class="cat-piano-decor" aria-hidden="true">
      <div class="cat-piano-glow">
        <img src="cat-piano.webp" alt="" draggable="false">
      </div>
    </div>
    <button type="button" class="leaf-side-btn" id="leafToggleBtn" title="点击开启春の特效" aria-label="季节特效开关" aria-pressed="false">
      🎹☕️🐈
    </button>
  </div>
    <div class="keyboard-wrap" id="keyboardWrap">
      <div class="keyboard" id="keyboard"></div>
    </div>
  </div>

</div>


<!-- 控制面板浮层 -->
<div id="ctrlPanel">
  <div class="ctrl-card" id="ctrlCard">
    <h3>控制面板</h3>
    <div class="ctrl-section">
      <div class="ctrl-section-title">运输</div>
      <div class="panel sliders">
        <label><span class="lab">速度</span> <input type="range" id="tempo" min="50" max="160" value="92"> <span class="val" id="tempoVal">92</span></label>
        <label><span class="lab">移调</span> <input type="range" id="transpose" min="-12" max="12" value="0"> <span class="val" id="transposeVal">0</span></label>
      </div>
    </div>
    <div class="ctrl-section">
      <div class="ctrl-section-title">音色</div>
      <div class="panel sliders">
        <label><span class="lab">主音</span> <input type="range" id="volMain" min="0" max="100" value="58"> <span class="val" id="volMainVal">58</span></label>
        <label><span class="lab">和弦</span> <input type="range" id="volChord" min="0" max="100" value="32"> <span class="val" id="volChordVal">32</span></label>
        <label><span class="lab">混响</span> <input type="range" id="reverb" min="0" max="100" value="32"> <span class="val" id="reverbVal">32</span></label>
      </div>
      <div class="expr-bar" id="exprBar" title="当前表情力度"><i id="exprBarFill"></i></div>
    </div>
    <div class="ctrl-section">
      <div class="ctrl-section-title">表现</div>
      <div class="panel toggles">
        <label class="chk"><input type="checkbox" id="pedalToggle" checked> 自动踏板</label>
        <label class="chk"><input type="checkbox" id="nameToggle" checked> 显示音名</label>
        <label class="chk"><input type="checkbox" id="exprToggle" checked> 表情渐强</label>
        <label class="chk"><input type="checkbox" id="loopToggle"> 循环播放</label>
      </div>
    </div>
    <div class="ctrl-section">
      <button type="button" class="btn" id="defaultBtn" style="width:100%;">恢复默认</button>
    </div>
    <div class="legend">
      <span><i class="dot blue"></i> 正在弹奏</span>
      <span><i class="dot yellow"></i> 下一个预备</span>
    </div>
  </div>
</div>

<!-- 选曲弹窗：曲库 + 添加（简谱 / MIDI / 哼唱） -->
<div id="songModal">
  <div class="modal-card">
    <h2>曲库与添加 🎹</h2>
    <p class="hint">曲库点选即播 · 添加支持简谱 / MIDI / 哼唱识别</p>

    <div class="modal-tabs" id="modalMainTabs" role="tablist">
      <button type="button" class="tab active" data-main-tab="library" role="tab" aria-selected="true">曲库</button>
      <button type="button" class="tab" data-main-tab="add" role="tab" aria-selected="false">添加曲目</button>
    </div>

    <div class="modal-pane active" id="paneLibrary" data-main-pane="library">
      <div class="lib-toolbar">
        <button class="btn" id="exportAllBtn" type="button">📦 导出全部</button>
        <button class="btn" id="importLibBtn" type="button">📥 导入 JSON</button>
        <input type="file" id="importLibFile" accept=".json,application/json" style="display:none">
      </div>
      <div class="song-list-toggle" id="songListToggle"></div>
      <div class="song-list" id="songList"></div>
      <div class="lib-footer-actions">
        <button class="btn" id="closeSongBtn" type="button">关闭</button>
      </div>
    </div>

    <div class="modal-pane" id="paneAdd" data-main-pane="add">
      <div class="add-subtabs" id="modalAddTabs" role="tablist">
        <button type="button" class="subtab active" data-add-tab="score" role="tab">简谱</button>
        <button type="button" class="subtab" data-add-tab="midi" role="tab">MIDI</button>
        <button type="button" class="subtab" data-add-tab="listen" role="tab">哼唱</button>
      </div>

      <div class="add-pane active" id="addPaneScore" data-add-pane="score">
        <p class="hint-inline">空格分隔音名，休止用 - 或 rest。保存后自动配和弦。</p>
        <div class="custom-box">
          <label>自定义曲名</label>
          <input type="text" id="customName" placeholder="我的曲子" maxlength="40">
          <label style="margin-top:8px;">音符序列</label>
          <textarea id="customNotes" placeholder="例：C4 C4 G4 G4 A4 A4 G4 - F4 F4 E4 E4 D4 D4 C4"></textarea>
          <div class="modal-actions">
            <button class="btn" id="applyCustomBtn">使用自定义谱</button>
            <button class="btn" id="closeSongBtn2" type="button">关闭</button>
          </div>
        </div>
      </div>

      <div class="add-pane" id="addPaneMidi" data-add-pane="midi">
        <p class="hint-inline">导入 .mid / .midi，可加入曲库长期保存。</p>
        <div class="midi-row">
          <label>选择 MIDI 文件</label>
          <input type="file" id="midiFile" accept=".mid,.midi,audio/midi,audio/x-midi" multiple>
          <button class="btn add-lib" id="addMidiToLibBtn" disabled type="button">加入曲库</button>
        </div>
      </div>

      <div class="add-pane" id="addPaneListen" data-add-pane="listen">
        <div class="listen-panel" id="listenPanel" style="display:block;">
          <div class="listen-pitch" id="listenPitch">—</div>
          <div class="listen-sub">对着麦克风哼唱，或外放歌曲让麦克风听到</div>
          <label style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:0.78rem;color:var(--muted);margin:8px 0;">
            <span>灵敏度</span>
            <input type="range" id="listenSens" min="1" max="10" value="6" style="width:120px;accent-color:var(--accent);">
            <span id="listenSensVal" style="min-width:1.2em;color:var(--text);font-weight:600;">6</span>
          </label>
          <button class="btn" id="listenToggleBtn" type="button">🎙️ 开始聆听</button>
          <div class="sheet-status" id="listenStatus"></div>
          <button class="btn" id="listenToScoreBtn" type="button" style="margin-top:8px;width:100%;">写入简谱栏</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="core.js"></script>
<script src="audio-midi.js"></script>
<script src="playback.js"></script>
<script src="listen.js"></script>
<script src="ui-extras.js"></script>
</body>
</html>
