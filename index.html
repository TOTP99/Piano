  function normalizeSongKey(name) {
    return String(name || "")
      .toLowerCase()
      .replace(/[_\-\.]+/g, " ")
      .replace(/[^a-z0-9\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  function lookupSongZh(name) {
    const key = normalizeSongKey(name);
    if (!key) return null;
    if (SONG_NAME_ZH_MAP[key]) return SONG_NAME_ZH_MAP[key];
    let best = null, bestLen = 0;
    Object.keys(SONG_NAME_ZH_MAP).forEach(function (k) {
      if (k.length < 4) return;
      if ((key.indexOf(k) >= 0 || k.indexOf(key) >= 0) && k.length > bestLen) {
        best = SONG_NAME_ZH_MAP[k];
        bestLen = k.length;
      }
    });
    return best;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ========== 枫叶飘落粒子系统（独立 Canvas，与钢琴/音频/MIDI 完全解耦）==========
  const MapleLeaves = (function () {
    const canvas = document.getElementById("mapleLeafCanvas");
    if (!canvas) return { setEnabled() {}, notifyPlayStart() {}, notifyPlayStop() {} };
    const ctx = canvas.getContext("2d");

    const COLORS = [
      { fill: "#e2593b", edge: "#8b2a18" }, // 枫红
      { fill: "#d4923a", edge: "#8a5a18" }, // 橙褐
      { fill: "#efc06a", edge: "#b3852f" }  // 金黄
    ];

    let W = 0, H = 0, dpr = 1;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    function rand(min, max) { return min + Math.random() * (max - min); }

    function targetCount() {
      const isNarrow = W < 760;
      const cores = navigator.hardwareConcurrency || 4;
      let n = isNarrow ? 26 : 52;
      if (cores <= 2) n = Math.round(n * 0.55);
      else if (cores <= 4) n = Math.round(n * 0.8);
      return Math.max(14, Math.min(60, n));
    }

    let leaves = [];
    let spawning = false;   // 是否继续生成新叶
    let running = false;    // rAF 循环是否在跑
    let rafId = null;
    let alpha = 0, alphaTarget = 0; // 整体透明度渐入渐出
    let lastTs = null;

    function makeLeaf(fromTop) {
      const depth = Math.random();               // 0 远景（小而慢）→ 1 近景（大而快）
      const big = !fromTop ? false : Math.random() < 0.035; // 偶尔一片大叶子
      const size = big ? rand(30, 42) : rand(10, 24) * (0.55 + depth * 0.6);
      const color = COLORS[(Math.random() * COLORS.length) | 0];
      return {
        x: rand(-40, W + 40),
        y: fromTop ? rand(-140, -20) : rand(-H, H),
        size,
        big,
        rot: rand(0, Math.PI * 2),
        rotSpeed: rand(-0.8, 0.8) * (0.35 + depth * 0.65),
        swayPhase: rand(0, Math.PI * 2),
        swayAmp: rand(16, 40) * (0.6 + depth * 0.6),
        swaySpeed: rand(0.35, 0.85),
        speedY: big ? rand(34, 46) : (16 + depth * 30 + rand(-3, 5)),
        opacity: rand(0.5, 0.9) * (0.65 + depth * 0.35),
        blur: (1 - depth) * 1.5,
        color
      };
    }

    function spawnInitial() {
      leaves = [];
      const n = targetCount();
      for (let i = 0; i < n; i++) leaves.push(makeLeaf(false));
    }

    function drawLeaf(l, t) {
      const sway = Math.sin(t * l.swaySpeed + l.swayPhase) * l.swayAmp;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, l.opacity * alpha));
      ctx.translate(l.x + sway, l.y);
      ctx.rotate(l.rot);
      if (l.blur > 0.05) ctx.filter = "blur(" + l.blur.toFixed(2) + "px)";
      const s = l.size / 32;
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.bezierCurveTo(4, -12, 6, -10, 10, -10);
      ctx.bezierCurveTo(8, -6, 8, -4, 12, -2);
      ctx.bezierCurveTo(8, 0, 8, 2, 11, 6);
      ctx.bezierCurveTo(6, 5, 4, 6, 3, 9);
      ctx.bezierCurveTo(2, 5, 1, 3, 0, 8);
      ctx.bezierCurveTo(-1, 3, -2, 5, -3, 9);
      ctx.bezierCurveTo(-4, 6, -6, 5, -11, 6);
      ctx.bezierCurveTo(-8, 2, -8, 0, -12, -2);
      ctx.bezierCurveTo(-8, -4, -8, -6, -10, -10);
      ctx.bezierCurveTo(-6, -10, -4, -12, 0, -16);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, -16, 0, 10);
      grad.addColorStop(0, l.color.fill);
      grad.addColorStop(1, l.color.edge);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,240,220,0.28)";
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(0, 8);
      ctx.moveTo(0, -6); ctx.lineTo(8, -2);
      ctx.moveTo(0, -6); ctx.lineTo(-8, -2);
      ctx.moveTo(0, 0); ctx.lineTo(9, 5);
      ctx.moveTo(0, 0); ctx.lineTo(-9, 5);
      ctx.stroke();
      ctx.restore();
    }

    function frame(ts) {
      if (!running) return;
      if (lastTs == null) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      const t = ts / 1000;

      if (alpha < alphaTarget) alpha = Math.min(alphaTarget, alpha + dt * 0.7);
      else if (alpha > alphaTarget) alpha = Math.max(alphaTarget, alpha - dt * 0.45);

      ctx.clearRect(0, 0, W, H);
      leaves.sort(function (a, b) { return a.size - b.size; }); // 小(远)先画，大(近)后画，制造景深

      for (let i = leaves.length - 1; i >= 0; i--) {
        const l = leaves[i];
        l.y += l.speedY * dt;
        l.rot += l.rotSpeed * dt;
        if (l.y - l.size > H + 60) {
          if (spawning) { leaves[i] = makeLeaf(true); }
          else { leaves.splice(i, 1); }
          continue;
        }
        drawLeaf(l, t);
      }

      if (!spawning && leaves.length === 0 && alpha <= 0.01) {
        running = false; lastTs = null;
        ctx.clearRect(0, 0, W, H);
        return;
      }
      rafId = requestAnimationFrame(frame);
    }

    function startLoop() {
      spawning = true;
      alphaTarget = 1;
      if (!leaves.length) spawnInitial();
      if (!running) { running = true; lastTs = null; rafId = requestAnimationFrame(frame); }
    }
    function stopLoop() {
      spawning = false;
      alphaTarget = 0;
      if (!running && leaves.length) { running = true; lastTs = null; rafId = requestAnimationFrame(frame); }
    }

    // 播放状态与总开关双重控制：两者都满足才真正飘叶
    let enabledByToggle = false;
    let activeByPlay = false;
    function sync() {
      if (enabledByToggle && activeByPlay) startLoop();
      else stopLoop();
    }
    return {
      setEnabled: function (on) { enabledByToggle = !!on; sync(); },
      notifyPlayStart: function () { activeByPlay = true; sync(); },
      notifyPlayStop: function () { activeByPlay = false; sync(); }
    };
  })();

  // ========== 枫叶开关按钮（UI，不改核心演奏逻辑）==========
  let leavesEnabled = false;
  function setLeavesEnabled(on) {
    leavesEnabled = !!on;
    var btn = document.getElementById("leafToggleBtn");
    if (btn) {
      btn.setAttribute("aria-pressed", leavesEnabled ? "true" : "false");
      btn.title = "秋色の🍁";
      btn.textContent = "秋色の🍁";
    }
    document.documentElement.classList.toggle("leaves-on", !!leavesEnabled);
    MapleLeaves.setEnabled(leavesEnabled);
  }
  (function setupLeafDecor() {
    setLeavesEnabled(false);
    var leafBtn = document.getElementById("leafToggleBtn");
    if (leafBtn) {
      leafBtn.addEventListener("click", function (e) {
        e.preventDefault();
        setLeavesEnabled(!leavesEnabled);
      });
    }
  })();

  // ========== 横竖屏自动检测 ==========
  // 竖屏：保持原样不变。
  // 横屏：只保留命令栏与曲名，钢琴键盘缩放到全部可见（无需横向滚动）。不联动飘叶效果，节约资源。
  (function setupOrientationMode() {
    let resizeTimer = null;

    function isLandscape() {
      return window.matchMedia("(orientation: landscape)").matches;
    }

    function enterLandscape() {
      document.documentElement.classList.add("landscape-compact");
      fitKeyboardToViewport();
    }

    function exitLandscape() {
      document.documentElement.classList.remove("landscape-compact");
      resetKeyboardFit();
    }

    function applyOrientationMode() {
      const landscape = isLandscape();
      const active = document.documentElement.classList.contains("landscape-compact");
      if (landscape && !active) { enterLandscape(); return; }
      if (!landscape && active) { exitLandscape(); return; }
      if (landscape && active) fitKeyboardToViewport(); // 横屏下窗口尺寸变化（如转屏微调）时持续适配
    }

    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(applyOrientationMode, 120);
    });
    window.addEventListener("orientationchange", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(applyOrientationMode, 180);
    });
    if (window.matchMedia) {
      const mq = window.matchMedia("(orientation: landscape)");
      if (mq.addEventListener) mq.addEventListener("change", applyOrientationMode);
      else if (mq.addListener) mq.addListener(applyOrientationMode);
    }
    applyOrientationMode();
  })();

})();
</script>
</body>
</html>
