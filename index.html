  // ========== 横竖屏演奏：节奏联动飘落枫叶 + 地面堆积 ==========
  (function setupFallingLeaves() {
    var canvas = document.getElementById("leafCanvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var leaves = [];
    var groundLeaves = []; // 已落地、堆积在地面的枫叶
    var rafId = null;
    var lastTs = 0;
    var recentHits = []; // 近 1.2s 内发声时刻，用于估计弹奏密度
    var FALL_SPEED = 78; // px/s，全体基本一致
    var MAX_LEAVES = 24;
    var lastSpawnAt = 0;
    var SPAWN_THROTTLE_MS = 55; // 同一瞬间的和弦/多音只算一次飘叶，避免扎堆
    var MAX_GROUND_LEAVES = 150;
    var GROUND_MARGIN = 4;      // 地面基线与视口底边的距离
    var GROUND_MAX_PILE = 46;   // 单个区块最大堆积高度
    var BUCKET_COUNT = 30;      // 将地面横向分区，分区独立计算堆高，形成起伏的落叶堆
    var bucketHeights = [];
    var windPhase = Math.random() * Math.PI * 2;

    function ensureBuckets() {
      if (bucketHeights.length !== BUCKET_COUNT) {
        bucketHeights = new Array(BUCKET_COUNT).fill(0);
      }
    }
    ensureBuckets();

    function bucketIndex(x, w) {
      var idx = Math.floor((x / w) * BUCKET_COUNT);
      if (idx < 0) idx = 0;
      if (idx >= BUCKET_COUNT) idx = BUCKET_COUNT - 1;
      return idx;
    }

    // 枫叶路径（归一化到约 0..1 包围盒，绘制时再缩放）—— 两种叶形随机分配，避免画面单一
    var LEAF_PATH = null;
    var LEAF_PATH_B = null;
    function ensureLeafPath(shape) {
      if (shape === 1) {
        if (!LEAF_PATH_B) {
          LEAF_PATH_B = new Path2D(
            "M32 3L35 11L45 6L42 19L58 16L46 29L55 38L41 34L46 49L34 40L32 53L30 40L18 49L23 34L9 38L18 29L6 16L22 19L19 6L29 11Z"
          );
        }
        return LEAF_PATH_B;
      }
      if (!LEAF_PATH) {
        LEAF_PATH = new Path2D(
          "M32 2L36 9L47 5L43 17L60 13L47 27L57 35L43 33L49 47L36 39L33 51L36 62L32 65L28 62L31 51L28 39L15 47L21 33L7 35L17 27L4 13L21 17L17 5L28 9Z"
        );
      }
      return LEAF_PATH;
    }
    // 主脉+侧脉描边，弱化"团块状"观感，让叶脉从中心辐射出五个尖角
    var LEAF_VEINS = null;
    var LEAF_VEINS_B = null;
    function ensureLeafVeins(shape) {
      if (shape === 1) {
        if (!LEAF_VEINS_B) {
          LEAF_VEINS_B = new Path2D("M32 6L32 46M31 20L54 15M33 20L10 15M31 30L50 34M33 30L14 34");
        }
        return LEAF_VEINS_B;
      }
      if (!LEAF_VEINS) {
        LEAF_VEINS = new Path2D("M32 5L32 48M31 21L57 14M33 21L7 14M31 32L53 35M33 32L11 35");
      }
      return LEAF_VEINS;
    }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = window.innerWidth;
      var h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function isPortraitPlaying() {
      return state.isPlaying && !state.isPaused;
    }

    function syncPlayingClass() {
      document.documentElement.classList.toggle("playing-leaves", isPortraitPlaying());
    }

    /** 四档弹奏快慢：红最快 → 黄 → 绿 → 杂色最慢 */
    function speedTier() {
      var now = performance.now();
      recentHits = recentHits.filter(function (t) { return now - t < 1200; });
      var rate = recentHits.length / 1.2; // 约每秒音符数
      var tempo = state.tempo || 92;
      // 综合速度感：曲速 + 近期密度
      var score = tempo * 0.55 + rate * 18;
      if (score >= 115) return 0; // 红
      if (score >= 95) return 1;  // 黄
      if (score >= 75) return 2;  // 绿
      return 3; // 杂色
    }

    // 全部秋叶色系混合，供各档偶尔"串色"抽取，让画面色彩更丰富
    var MASTER_PALETTE = [
      "#c23b22", "#e85a3c", "#a82818", "#d44530", "#f2401f", "#9c2a14",
      "#e09a2b", "#efc06a", "#d4923a", "#c87820", "#f2b705", "#b8791f",
      "#6a9a4e", "#8aba60", "#4e7a38", "#a0c878", "#5c8a3a", "#7fae52",
      "#b86a30", "#8b5a2a", "#d4a050", "#7a2e12", "#9c4b1f", "#c9843c"
    ];

    function tierColors(tier) {
      if (tier === 0) {
        return ["#c23b22", "#e85a3c", "#a82818", "#d44530", "#f2401f", "#9c2a14"];
      }
      if (tier === 1) {
        return ["#e09a2b", "#efc06a", "#d4923a", "#c87820", "#f2b705", "#b8791f"];
      }
      if (tier === 2) {
        return ["#6a9a4e", "#8aba60", "#4e7a38", "#a0c878", "#5c8a3a", "#7fae52"];
      }
      // 杂色：秋叶全混色
      return MASTER_PALETTE;
    }

    function spawnFromNote(vel, duration) {
      if (!isPortraitPlaying()) return;
      var now = performance.now();
      recentHits.push(now);
      // 节流：和弦/密集连音等同一瞬间触发的多个音符，合并为一次飘叶，避免扎堆
      if (now - lastSpawnAt < SPAWN_THROTTLE_MS) {
        syncPlayingClass();
        startLoop();
        return;
      }
      lastSpawnAt = now;
      var tier = speedTier();
      var colors = tierColors(tier);
      // 多少：力度与时值 → 数量（整体较此前减半）；长短句：长音少而大，短音多而小
      var longNote = duration > 0.55;
      var count = longNote
        ? (vel > 0.55 ? 1 : (Math.random() < 0.35 ? 1 : 0))
        : Math.max(1, Math.min(3, Math.round(1 + vel * 2 + (Math.random() > 0.8 ? 1 : 0))));
      var w = window.innerWidth;
      var i;
      for (i = 0; i < count; i++) {
        if (leaves.length >= MAX_LEAVES) leaves.shift();
        // 大中小随机分布，不再强绑定力度，尺寸差异更明显
        var sizeRoll = Math.random();
        var size = longNote
          ? (sizeRoll < 0.28 ? 14 + Math.random() * 10   // 小
             : sizeRoll < 0.65 ? 24 + Math.random() * 14  // 中
             : 36 + Math.random() * 20)                    // 大
          : (sizeRoll < 0.4 ? 6 + Math.random() * 8        // 小
             : sizeRoll < 0.78 ? 14 + Math.random() * 12   // 中
             : 24 + Math.random() * 16);                   // 大
        size += vel * 5;
        // 八成用当档配色，两成串色到全秋叶混色，颜色更丰富且不单调
        var palette = Math.random() < 0.8 ? colors : MASTER_PALETTE;
        leaves.push({
          x: Math.random() * w,
          y: -20 - Math.random() * 40,
          size: size,
          shape: Math.random() < 0.5 ? 0 : 1, // 两种叶形随机分配，画面不再千篇一律
          rot: Math.random() * Math.PI * 2,
          rotSp: (Math.random() - 0.5) * 1.4,
          // 下落速度基本一致，仅 ±8% 微差
          vy: FALL_SPEED * (0.92 + Math.random() * 0.16),
          vx: (Math.random() - 0.5) * 10,
          color: palette[(Math.random() * palette.length) | 0],
          alpha: 0.55 + Math.random() * 0.35,
          // 主摆：左右大幅飘荡；副摆：叠加更快的小幅颤动，模拟真实枫叶的不规则轨迹
          sway: Math.random() * Math.PI * 2,
          swaySp: 1.1 + Math.random() * 1.3,
          swayAmp: 15 + Math.random() * 15,
          sway2: Math.random() * Math.PI * 2,
          swaySp2: 2.6 + Math.random() * 2.4,
          // 打旋相位：叶片周期性侧对视角变窄，模拟真实枫叶下落时的 3D 翻转感
          flip: Math.random() * Math.PI * 2,
          flipSp: 1.6 + Math.random() * 2.2
        });
      }
      syncPlayingClass();
      startLoop();
    }

    function drawLeaf(L) {
      var path = ensureLeafPath(L.shape);
      ctx.save();
      ctx.translate(L.x, L.y);
      ctx.rotate(L.rot);
      var s = L.size / 64;
      // 打旋：随 flip 相位周期性变窄，模拟叶片侧对视角时的 3D 翻转感（成本极低，只是多一个 scale 项）
      var flipScale = Math.max(0.18, Math.abs(Math.cos(L.flip)));
      ctx.scale(s * flipScale, s);
      ctx.translate(-32, -32);
      ctx.globalAlpha = L.alpha;
      ctx.fillStyle = L.color;
      ctx.fill(path);
      ctx.globalAlpha = L.alpha * 0.5;
      ctx.strokeStyle = "rgba(60, 20, 10, 0.55)";
      ctx.lineWidth = 2.2;
      ctx.stroke(ensureLeafVeins(L.shape));
      ctx.restore();
    }

    // 落地后的枫叶压扁绘制，呈现平躺在地面的堆积感
    function drawGroundLeaf(L) {
      var path = ensureLeafPath(L.shape);
      ctx.save();
      ctx.translate(L.x, L.y);
      ctx.rotate(L.rot);
      var s = L.size / 64;
      ctx.scale(s, s * 0.6);
      ctx.translate(-32, -32);
      ctx.globalAlpha = L.alpha;
      ctx.fillStyle = L.color;
      ctx.fill(path);
      ctx.globalAlpha = L.alpha * 0.45;
      ctx.strokeStyle = "rgba(50, 18, 8, 0.5)";
      ctx.lineWidth = 2.4;
      ctx.stroke(ensureLeafVeins(L.shape));
      ctx.restore();
    }

    // 一片枫叶落地：按所在横向区块的当前堆高决定落点，越堆越高，形成自然起伏的落叶堆
    function landLeaf(L, w, h) {
      var bi = bucketIndex(L.x, w);
      var pileH = Math.min(bucketHeights[bi], GROUND_MAX_PILE);
      var restX = Math.max(4, Math.min(w - 4, L.x + (Math.random() - 0.5) * 6));
      var restY = h - GROUND_MARGIN - pileH - L.size * 0.18 * Math.random();
      groundLeaves.push({
        x: restX,
        y: restY,
        size: L.size * (0.88 + Math.random() * 0.16),
        shape: L.shape,
        rot: L.rot + (Math.random() - 0.5) * 0.6,
        color: L.color,
        alpha: Math.min(0.82, L.alpha + 0.15)
      });
      bucketHeights[bi] = Math.min(GROUND_MAX_PILE, bucketHeights[bi] + L.size * 0.1 + 1.5);
      if (groundLeaves.length > MAX_GROUND_LEAVES) groundLeaves.shift();
    }

    function tick(ts) {
      rafId = null;
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      if (!isPortraitPlaying() && leaves.length === 0) {
        syncPlayingClass();
        lastTs = 0;
        return;
      }

      var h = window.innerHeight;
      var w = window.innerWidth;
      ensureBuckets();
      ctx.clearRect(0, 0, w, h);

      // 地面堆积随时间缓慢消退（似被风带走），避免无限堆高，同时保持画面常新
      var gi;
      if (groundLeaves.length) {
        var nextGround = [];
        for (gi = 0; gi < groundLeaves.length; gi++) {
          var G = groundLeaves[gi];
          G.alpha -= dt * 0.010;
          if (G.alpha > 0.04) nextGround.push(G);
        }
        groundLeaves = nextGround;
      }
      for (gi = 0; gi < bucketHeights.length; gi++) {
        bucketHeights[gi] = Math.max(0, bucketHeights[gi] - dt * 0.35);
      }
      for (gi = 0; gi < groundLeaves.length; gi++) drawGroundLeaf(groundLeaves[gi]);

      // 整体风场：低频漂移 + 稍快的小扰动叠加，让一批叶子的横向趋势更自然地联动
      windPhase += dt * 0.35;
      var wind = Math.sin(windPhase) * 10 + Math.sin(windPhase * 0.37) * 6;

      var next = [];
      var i, L;
      for (i = 0; i < leaves.length; i++) {
        L = leaves[i];
        L.sway += L.swaySp * dt;
        L.sway2 += L.swaySp2 * dt;
        L.flip += L.flipSp * dt;
        var swayVel = Math.sin(L.sway) * L.swayAmp + Math.sin(L.sway2) * (L.swayAmp * 0.4);
        L.x += (L.vx + wind) * dt + swayVel * dt;
        // 下落速度叠加轻微起伏，模拟空气阻力对飘落节奏的扰动（整体仍保持基本一致）
        var vyMod = L.vy * (1 + Math.sin(L.sway * 0.6) * 0.06);
        L.y += vyMod * dt;
        // 转速与摆动联动：摆得越猛，翻转越明显，更像真实枫叶打旋下落
        L.rot += (L.rotSp + Math.cos(L.sway) * L.rotSp * 0.35) * dt;

        var pileH = Math.min(bucketHeights[bucketIndex(L.x, w)], GROUND_MAX_PILE);
        var groundY = h - GROUND_MARGIN - pileH - L.size * 0.2;
        if (L.y >= groundY) {
          landLeaf(L, w, h);
          continue;
        }
        if (L.x < -40) L.x = w + 20;
        if (L.x > w + 40) L.x = -20;
        drawLeaf(L);
        next.push(L);
      }
      leaves = next;

      if (!isPortraitPlaying() && leaves.length === 0) {
        syncPlayingClass();
        lastTs = 0;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function startLoop() {
      if (rafId) return;
      lastTs = 0;
      rafId = requestAnimationFrame(tick);
    }

    function clearLeaves() {
      leaves = [];
      groundLeaves = [];
      ensureBuckets();
      for (var bi = 0; bi < bucketHeights.length; bi++) bucketHeights[bi] = 0;
      recentHits = [];
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTs = 0;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      syncPlayingClass();
    }

    window.leafFx = {
      onNote: spawnFromNote,
      sync: syncPlayingClass,
      clear: clearLeaves,
      resize: resize
    };

    resize();
    window.addEventListener("resize", resize);
  })();

  // ========== 屏幕方向：横屏枫叶 + 平滑过渡 ==========
  (function setupOrientation() {
    var lastLandscape = null;
    var resizeTimer = null;
    var animTimer = null;
    var root = document.documentElement;

    function readLandscape() {
      try {
        if (window.matchMedia) {
          return window.matchMedia("(orientation: landscape)").matches;
        }
      } catch (e) {}
      return window.innerWidth > window.innerHeight;
    }

    function apply(force) {
      var landscape = readLandscape();
      if (!force && landscape === lastLandscape) return;
      var changed = lastLandscape !== null && landscape !== lastLandscape;
      lastLandscape = landscape;

      root.classList.toggle("landscape", landscape);
      root.classList.toggle("portrait", !landscape);
      // 保证至少有一个方向类
      if (!root.classList.contains("landscape") && !root.classList.contains("portrait")) {
        root.classList.add("portrait");
      }
      try {
        if (window.leafFx) window.leafFx.sync();
      } catch (eLeaf) {}

      if (changed) {
        root.classList.add("orient-animating");
        if (animTimer) clearTimeout(animTimer);
        animTimer = setTimeout(function () {
          root.classList.remove("orient-animating");
          animTimer = null;
        }, 600);
        // 方向变化后稍晚重算键盘中心，配合布局过渡
        setTimeout(function () {
          try {
            if (typeof scrollToCenter === "function") scrollToCenter();
          } catch (e) {}
        }, 280);
      }
    }

    function onResize() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        apply(false);
      }, 80);
    }

    apply(true);
    window.addEventListener("orientationchange", function () {
      // iOS 等设备 orientationchange 后尺寸可能尚未更新
      setTimeout(function () { apply(false); }, 60);
      setTimeout(function () { apply(false); }, 200);
    });
    window.addEventListener("resize", onResize);
    if (window.matchMedia) {
      try {
        window.matchMedia("(orientation: landscape)").addEventListener("change", function () {
          apply(false);
        });
      } catch (e) {
        try {
          window.matchMedia("(orientation: landscape)").addListener(function () {
            apply(false);
          });
        } catch (e2) {}
      }
    }
  })();

})();
</script>
</body>
</html>
